# Agent-side protos (strata.event.v1, strata.fleet.v1) -> agent/gen.
# The admin API has its own template: buf.gen.admin.yaml.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/strata/strata/agent/gen
inputs:
  - directory: proto
    exclude_paths:
      - proto/strata/admin
plugins:
  - local: protoc-gen-go
    out: agent/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: agent/gen
    opt: paths=source_relative
