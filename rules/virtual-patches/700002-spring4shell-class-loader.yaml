# Virtual patch (rules/README.md: 700000-799999).
rule:
  id: 700002
  name: Spring4Shell class loader manipulation (CVE-2022-22965)
  layer: managed
  stage: request_body
  match:
    all:
    - targets: [ { var: args_names } ]
      transforms: [ lowercase ]
      operator: { type: rx, value: '(?:^|\.)class\.(?:module\.classloader|classloader|protectiondomain)\.' }
  score: 100
  severity: critical
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: rce
    accuracy: high
    systems: [java, spring]
    tags: [cve-2022-22965, virtual-patch]
tests:
  match:
  - method: POST
    uri: /app/greeting
    headers: { Host: api.example.test, Content-Type: application/x-www-form-urlencoded }
    body: class.module.classLoader.resources.context.parent.pipeline.first.pattern=x
  - uri: /app/greeting?class.module.classLoader.URLs%5B0%5D=0
    headers: { Host: api.example.test, User-Agent: example-client/1.0, Accept: application/json }
  no_match:
  - method: POST
    uri: /app/greeting
    headers: { Host: api.example.test, Content-Type: application/x-www-form-urlencoded }
    body: class=economy&module=intro&loader=fast
