# Good-bot verification (W18-R-02, W18-S-01): a User-Agent claiming a big
# crawler (Googlebot, Bingbot, Applebot) from an address outside the ranges
# its owner publishes. The ranges come with the bundle (section GOOD_BOTS,
# control plane W18-G2-02); without them the claim is "unknown" and this
# rule does not match. SEO tools that send a crawler User-Agent match too:
# give them a policy exception.
rule:
  id: 500001
  name: Crawler User-Agent from outside its published IP ranges
  layer: managed
  stage: request_headers
  match:
    all:
    - targets:
      - var: bot_verified
      operator:
        type: streq
        value: 'false'
  score: 100
  action_mode: score
  severity: error
  labels:
  - bot
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: bot
    accuracy: high
    risk: medium
tests:
  match:
  - uri: /
    headers:
      User-Agent: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
    remote_addr: 203.0.113.7
  - uri: /products?page=2
    headers:
      User-Agent: Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)
    remote_addr: 198.51.100.200
  - uri: /
    headers:
      User-Agent: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
    remote_addr: 2001:db8:2::1
  no_match:
  - uri: /
    headers:
      User-Agent: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
    remote_addr: 192.0.2.66
  - uri: /
    headers:
      User-Agent: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)
    remote_addr: 2001:db8:1::99
  - uri: /
    headers:
      User-Agent: Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)
    remote_addr: 198.51.100.10
  - uri: /
    headers:
      User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.6 Safari/605.1.15 (Applebot/0.1)
    remote_addr: 203.0.113.7
  - uri: /
    headers:
      User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0
    remote_addr: 203.0.113.7
