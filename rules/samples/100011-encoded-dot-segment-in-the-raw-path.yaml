# Sample rule (W03-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100011
  name: Encoded dot-segment in the raw path
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: uri_raw
      transforms:
      - lowercase
      operator:
        type: rx
        value: '%2e(%2e|\.)/|\.%2e/'
  score: 100
  severity: critical
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: path-traversal
    accuracy: high
    risk: high
tests:
  match:
  - uri: /static/%2e%2e/etc/passwd
  no_match:
  - uri: /static/app.js
