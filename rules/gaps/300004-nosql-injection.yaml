# Strata gap rule, W13-S-01: MongoDB-style operator and JavaScript
# injection (GoTestWAF nosql-injection, 15/10/2026).
# 22/10/2026: the URL path too (GoTestWAF URLPath).
# 22/10/2026: targets user_input (compiler-expanded, docs/spec/ir.schema.json).
# 22/10/2026: url_decode_uni first, so a payload percent-encoded once more
# (multipart, JSON, double encoding) is read decoded too.
rule:
  id: 300004
  name: NoSQL operator or server-side JavaScript injection
  layer: managed
  stage: request_body
  match:
    all:
    - targets: [ { var: user_input } ]
      transforms: [ url_decode_uni, lowercase ]
      operator:
        type: rx
        value: '\$(?:where|ne|gt|gte|lt|lte|nin|regex|or|and|nor|exists|expr|elemmatch)\b\s*[''"]?\s*:|\[\s*\$(?:ne|gt|gte|lt|lte|regex|where|nin|exists)\s*\]|\bdo\s*\{[^}]{0,200}\}\s*while\s*\(|\bdb\.[a-z_]\w*\.(?:insert|find|update|remove|drop|aggregate)\w*\s*\('
  score: 100
  action_mode: score
  severity: critical
  metadata:
    source: strata
    license: Apache-2.0
    owner: rules-team
    review_by: "2027-01-15"
    attack_type: other
    accuracy: high
    tags: [w13-s-01, gotestwaf, nosql-injection]
tests:
  match:
  - uri: /v1/items/true%2C%20$where:%20%2799%20==%2088%27
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /db.injection.insert%28%7Bsuccess:1%7D%29%3B
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/orders?sort=%27%2C%20$or:%20%5B%20%7B%7D%2C%20%7B%20%27order%27:%27order
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/items?q=0%3Bvar%20date=new%20Date%28%29%3B%20do%7BcurDate%20=%20new%20Date%28%29%3B%7Dwhile%28curDate-date%3C10000%29
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/login?user%5B%24ne%5D=x&pass%5B%24ne%5D=x
    headers: { Host: api.example.test, Accept: application/json }
  - method: POST
    uri: /v1/items
    headers: { Host: api.example.test, Content-Type: application/json }
    body: '{"q":"db.injection.insert({success:1});"}'
  no_match:
  - uri: /v1/docs/do-while-loops/%7Bexamples%7D
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/prices/$10-or-more
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/pricing?q=save+%2410+or+more
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/help?q=do+it+while+you+can
    headers: { Host: api.example.test, Accept: application/json }
