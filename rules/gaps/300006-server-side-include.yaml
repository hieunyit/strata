# Strata gap rule, W13-S-01: server-side include directives (GoTestWAF
# ss-include, 15/10/2026).
rule:
  id: 300006
  name: Server-side include directive
  layer: managed
  stage: request_body
  match:
    all:
    - targets: [ { var: args }, { var: request_headers }, { var: request_body } ]
      transforms: [ lowercase ]
      operator:
        type: rx
        value: '<!--\s*#\s*(?:exec|include|echo|config|set|printenv|fsize|flastmod)\b'
  score: 100
  action_mode: score
  severity: critical
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: rce
    accuracy: high
    tags: [w13-s-01, gotestwaf, ssi]
tests:
  match:
  - uri: /v1/page?c=%3C%21--%23exec%20cmd%3D%22ls%22%20--%3E
    headers: { Host: api.example.test, Accept: application/json }
  - method: POST
    uri: /v1/comments
    headers: { Host: api.example.test, Content-Type: application/x-www-form-urlencoded }
    body: text=%3C%21--%23include+virtual%3D%22%2Fetc%2Fpasswd%22--%3E
  no_match:
  - uri: /v1/page?c=%3C%21--+comment+--%3E
    headers: { Host: api.example.test, Accept: application/json }
