# Strata gap rule, W13-S-01: server-side template injection probes and
# payloads (GoTestWAF sst-injection, 15/10/2026).
rule:
  id: 300005
  name: Server-side template expression in a parameter
  layer: managed
  stage: request_body
  match:
    all:
    - targets: [ { var: args }, { var: request_headers } ]
      transforms: [ lowercase ]
      operator:
        type: rx
        value: '\{\{\s*\d+\s*[*+]\s*\d+\s*\}\}|[$#]\{\s*\d+\s*[*+]\s*\d+\s*\}|<%=\s*\d+\s*[*+]\s*\d+\s*%>|freemarker\.template\.utility\.execute|\{\{[^}]{0,80}(?:__class__|__globals__|__builtins__|__subclasses__|config\.items\(\)|request\.application)'
  score: 100
  action_mode: score
  severity: critical
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: template-injection
    accuracy: high
    tags: [w13-s-01, gotestwaf]
tests:
  match:
  - uri: /v1/greet?name=%7B%7B1337%2A1338%7D%7D
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/greet?name=aaaa%5Cu0027%252b%23%7B16%2A8787%7D%252b%5Cu0027bbb
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/greet?name=%3C%23assign%20ex%20%3D%20%22freemarker.template.utility.Execute%22%3Fnew%28%29%3E
    headers: { Host: api.example.test, Accept: application/json }
  no_match:
  - uri: /v1/greet?name=%7B%7Buser.name%7D%7D
    headers: { Host: api.example.test, Accept: application/json }
  - uri: /v1/calc?expr=12%2A7
    headers: { Host: api.example.test, Accept: application/json }
