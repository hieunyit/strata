# OWASP CRS 4.25.2, REQUEST-921-PROTOCOL-ATTACK.conf: generated by tools/strata-import-crs, do not edit.
ir_version: 1
ruleset:
  name: crs-921-protocol-attack
  version: 4.25.2
rules:
  - id: 921110
    name: HTTP Request Smuggling Attack
    layer: protocol
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?:get|p(?:(?:os|u)t|atch|rop(?:find|atch))|head|options|co(?:nnect|py)|delete|trac[ek]|m(?:kcol|ove)|(?:un)?lock)[\s\x0b]+[^\s\x0b]+[\s\x0b]+http/[0-9]
          targets:
            - var: args_names
            - var: args
            - var: request_body
            - var: xml
            - var: xml_attributes
          transforms:
            - html_entity_decode
            - lowercase
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "921110"
      upstream_version: 4.25.2
  - id: 921120
    name: HTTP Response Splitting Attack
    layer: protocol
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: '[\n\r][^0-9A-Z_a-z]*?(?:content-(?:type|length)|set-cookie|location):[\s\x0b]*[0-9A-Z_a-z]'
          targets:
            - var: request_cookies
            - var: request_cookies_names
            - var: args_names
            - var: args
            - var: xml
            - var: xml_attributes
          transforms:
            - lowercase
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "921120"
      upstream_version: 4.25.2
