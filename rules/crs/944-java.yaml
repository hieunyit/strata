# OWASP CRS 4.25.2, REQUEST-944-APPLICATION-ATTACK-JAVA.conf: generated by tools/strata-import-crs, do not edit.
ir_version: 1
ruleset:
  name: crs-944-java
  version: 4.25.2
rules:
  - id: 944100
    name: 'Remote Command Execution: Suspicious Java class detected'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: java\.lang\.(?:runtime|processbuilder)
          targets:
            - var: args
            - var: args_names
            - var: request_cookies
            - var: request_cookies_names
            - var: request_body
            - exclude:
                - Cookie
              var: request_headers
            - var: xml
            - var: xml_attributes
          transforms:
            - lowercase
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: rce
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "944100"
      upstream_version: 4.25.2
  - id: 944110
    name: 'Remote Command Execution: Java process spawn (CVE-2017-9805)'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?:runtime|processbuilder)
          targets:
            - var: args
            - var: args_names
            - var: request_cookies
            - var: request_cookies_names
            - var: request_body
            - exclude:
                - Cookie
              var: request_headers
            - var: xml
            - var: xml_attributes
          transforms:
            - lowercase
        - operator:
            type: rx
            value: (?i)(?:unmarshaller|base64data|java\.)
          targets:
            - var: matched_vars
            - var: xml
            - var: xml_attributes
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: rce
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "944110"
      upstream_version: 4.25.2
  - id: 944120
    name: 'Remote Command Execution: Java serialization (CVE-2015-4852)'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?:clonetransform|xmldecod)er|f(?:orclosure|ilewriter)|in(?:stantiate(?:factory|transformer)|vokertransformer)|(?:prototype(?:clone|serialization)factor|getpropert)y|whileclosure
          targets:
            - var: args
            - var: args_names
            - var: request_cookies
            - var: request_cookies_names
            - var: request_body
            - exclude:
                - Cookie
              var: request_headers
            - var: xml
            - var: xml_attributes
          transforms:
            - lowercase
        - operator:
            type: rx
            value: (?:runtime|processbuilder)
          targets:
            - var: matched_vars
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: rce
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "944120"
      upstream_version: 4.25.2
  - id: 944130
    name: Suspicious Java class detected
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: pm
            value:
              - com.opensymphony.xwork2
              - com.sun.org.apache
              - classLoader
              - declaredClass
              - freemarker.core
              - freemarker.template
              - freemarker.ext.rhino
              - java.io.BufferedInputStream
              - java.io.BufferedReader
              - java.io.ByteArrayInputStream
              - java.io.ByteArrayOutputStream
              - java.io.CharArrayReader
              - java.io.DataInputStream
              - java.io.File
              - java.io.FileOutputStream
              - java.io.FilePermission
              - java.io.FileWriter
              - java.io.FilterInputStream
              - java.io.FilterOutputStream
              - java.io.FilterReader
              - java.io.InputStream
              - java.io.IOException
              - java.io.LineNumberReader
              - java.io.ObjectInputStream
              - java.io.ObjectOutputStream
              - java.io.OutputStream
              - java.io.PipedOutputStream
              - java.io.PipedReader
              - java.io.PrintStream
              - java.io.PushbackInputStream
              - java.io.Reader
              - java.io.StringReader
              - java.lang.Class
              - java.lang.Enum
              - java.lang.Integer
              - java.lang.Number
              - java.lang.Object
              - java.lang.Process
              - java.lang.ProcessBuilder
              - java.lang.reflect
              - java.lang.Runtime
              - java.lang.String
              - java.lang.System
              - java.net.HttpURLConnection
              - java.net.JarURLConnection
              - java.net.DatagramSocket
              - java.net.MulticastSocket
              - java.net.ServerSocket
              - java.net.Socket
              - java.net.URL
              - javassist
              - javax.naming.InitialContext
              - javax.script.ScriptEngineManager
              - javax.xml.parsers
              - javax.xml.stream
              - OgnlContext
              - OgnlUtil
              - org.apache.commons
              - org.apache.struts
              - org.apache.struts2
              - org.dom4j.io.SAXReader
              - org.jdom2.input.SAXBuilder
              - org.omg.CORBA
              - org.xml.sax
              - PropertyUtilsBean
              - java.beans.XMLDecode
              - java.nio.file
              - sun.reflect
          targets:
            - var: args
            - var: args_names
            - var: request_cookies
            - var: request_cookies_names
            - var: request_body
            - var: path
            - exclude:
                - Cookie
              var: request_headers
            - var: xml
            - var: xml_attributes
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: rce
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "944130"
      upstream_version: 4.25.2
  - id: 944140
    name: 'Java Injection Attack: Java Script File Upload Found'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: .*\.(?:jsp|jspx)[./]*$
          targets:
            - var: files
            - key: X-Filename
              var: request_headers
            - key: X_Filename
              var: request_headers
            - key: X.Filename
              var: request_headers
            - key: X-File-Name
              var: request_headers
          transforms:
            - lowercase
            - remove_whitespace
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: rce
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "944140"
      upstream_version: 4.25.2
  - id: 944150
    name: 'Potential Remote Command Execution: Log4j / Log4shell'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?i)(?:\$|&dollar;?)(?:\{|&l(?:brace|cub);?)(?:[^\}]{0,15}(?:\$|&dollar;?)(?:\{|&l(?:brace|cub);?)|jndi|ctx)
          targets:
            - var: request_line
            - var: args
            - var: args_names
            - var: request_cookies
            - var: request_cookies_names
            - exclude:
                - Cookie
              var: request_headers
            - var: xml
            - var: xml_attributes
          transforms:
            - url_decode_uni
            - js_decode
            - html_entity_decode
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: rce
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "944150"
      upstream_version: 4.25.2
