    layer: managed
    stage: request_body
    match:
      all:
        - multi_match: true
          operator:
            type: detect_sqli
          targets:
            - var: request_cookies
            - var: request_cookies_names
            - key: User-Agent
              var: request_headers
            - key: Referer
              var: request_headers
            - var: args_names
            - var: args
            - var: xml
            - var: xml_attributes
          transforms:
            - utf8_to_unicode
            - url_decode_uni
            - remove_nulls
