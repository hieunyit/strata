            negate: true
            type: eq
            value: 0
          targets:
            - count: true
              key: Transfer-Encoding
              var: request_headers
        - operator:
            negate: true
            type: eq
            value: 0
          targets:
            - count: true
              key: Content-Length
              var: request_headers
    score: 60
    severity: warning
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "920181"
      upstream_version: 4.25.2
