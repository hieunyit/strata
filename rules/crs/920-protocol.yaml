# OWASP CRS 4.25.2, REQUEST-920-PROTOCOL-ENFORCEMENT.conf: generated by tools/strata-import-crs, do not edit.
ir_version: 1
ruleset:
  name: crs-920-protocol
  version: 4.25.2
rules:
  - id: 920120
    name: Attempted multipart/form-data bypass
    layer: protocol
    stage: request_body
    match:
      all:
        - operator:
            negate: true
            type: rx
            value: (?i)^(?:&(?:(?:[acegilnorsuz]acut|[aeiou]grav|[aino]tild)e|[c-elnr-tz]caron|(?:[cgklnr-t]cedi|[aeiouy]um)l|[aceg-josuwy]circ|[au]ring|a(?:mp|pos)|nbsp|oslash);|[^\"';=\x5c])*$
          targets:
            - var: files
            - var: files_names
          transforms:
            - url_decode_uni
    score: 100
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "920120"
      upstream_version: 4.25.2
  - id: 920160
    name: Content-Length HTTP header is not numeric
    layer: protocol
    stage: request_headers
    match:
      all:
        - operator:
            negate: true
            type: rx
            value: ^\d+$
          targets:
            - key: Content-Length
              var: request_headers
    score: 100
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "920160"
      upstream_version: 4.25.2
  - id: 920170
    name: GET or HEAD Request with Body Content
    layer: protocol
    stage: request_headers
    match:
      all:
        - operator:
            type: rx
            value: ^(?:GET|HEAD)$
          targets:
            - var: method
        - operator:
            negate: true
            type: rx
            value: ^0?$
          targets:
            - key: Content-Length
              var: request_headers
    score: 100
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "920170"
      upstream_version: 4.25.2
  - id: 920171
    name: GET or HEAD Request with Transfer-Encoding
    layer: protocol
    stage: request_headers
    match:
      all:
        - operator:
            type: rx
            value: ^(?:GET|HEAD)$
          targets:
            - var: method
        - operator:
            negate: true
            type: eq
            value: 0
          targets:
            - count: true
              key: Transfer-Encoding
              var: request_headers
    score: 100
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "920171"
      upstream_version: 4.25.2
  - id: 920181
