# OWASP CRS 4.25.2, REQUEST-943-APPLICATION-ATTACK-SESSION-FIXATION.conf: generated by tools/strata-import-crs, do not edit.
ir_version: 1
ruleset:
  name: crs-943-session-fixation
  version: 4.25.2
rules:
  - id: 943100
    name: 'Possible Session Fixation Attack: Setting Cookie Values in HTML'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?i)\.cookie\b.*?;[^0-9A-Z_a-z]*?(?:expires|domain)[^0-9A-Z_a-z]*?=|\bhttp-equiv[^0-9A-Z_a-z]+set-cookie\b
          targets:
            - var: request_cookies
            - var: request_cookies_names
            - var: args_names
            - var: args
          transforms:
            - url_decode_uni
    score: 100
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: other
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "943100"
      upstream_version: 4.25.2
  - id: 943120
    name: 'Possible Session Fixation Attack: SessionID Parameter Name with No Referer'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: ^(?:json\.)?(?:j(?:se(?:ssionid|rvsession)|wsession)|(?:asp(?:\.net_)?session|session[\-_]?)id|phpsessi(?:on|d)|(?:weblogic|laravel_)session|_(?:session_id|flask_session)|c(?:f(?:s?id|token)|onnect\.sid))$
          targets:
            - var: args_names
          transforms:
            - lowercase
        - operator:
            type: eq
            value: 0
          targets:
            - count: true
              key: Referer
              var: request_headers
    score: 100
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: other
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "943120"
      upstream_version: 4.25.2
