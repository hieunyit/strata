  - id: 941100
    name: XSS Attack Detected via libinjection
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: detect_xss
          targets:
            - var: request_cookies
            - var: request_cookies_names
            - key: User-Agent
              var: request_headers
            - var: args_names
            - var: args
            - var: xml
            - var: xml_attributes
          transforms:
            - utf8_to_unicode
            - url_decode_uni
            - html_entity_decode
            - js_decode
            - css_decode
            - remove_nulls
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: xss
