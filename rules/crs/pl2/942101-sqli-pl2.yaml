# OWASP CRS 4.25.2, REQUEST-942-APPLICATION-ATTACK-SQLI.conf (PL2)
# Paranoia Level 2 SQL Injection Detection
rule:
  id: 942101
  name: "SQL Injection Attack: Strict keyword and function sequence (PL2)"
  layer: managed
  stage: request_body
  match:
    all:
      - operator:
          type: rx
          value: '(?i)\b(?:concat_ws|group_concat|benchmark|load_file|sys_exec|xp_cmdshell|pg_sleep|sleep\s*\()\b'
        targets:
          - var: args
          - var: args_names
          - var: request_cookies
          - var: request_headers
            key: User-Agent
        transforms:
          - lowercase
          - url_decode_uni
  score: 100
  action_mode: score
  severity: critical
  paranoia_level: 2
  metadata:
    source: crs
    license: Apache-2.0
    author: OWASP CRS project
    upstream_id: "942101"
    upstream_version: "4.25.2"
    attack_type: sql-injection
    accuracy: high
    tags: [crs-pl2, sqli]
tests:
  match:
    - uri: /v1/products?id=1+and+sleep(5)
      headers: { Host: api.example.test, Accept: application/json }
    - uri: /v1/search?term=%27+union+select+group_concat(username)+from+users--
      headers: { Host: api.example.test, Accept: application/json }
  no_match:
    - uri: /v1/products?id=12345
      headers: { Host: api.example.test, Accept: application/json }
    - uri: /v1/articles?category=tech-news
      headers: { Host: api.example.test, Accept: application/json }
