# OWASP CRS 4.25.2, REQUEST-930-APPLICATION-ATTACK-LFI.conf (PL2)
# Paranoia Level 2 Local File Inclusion / Path Traversal Detection
rule:
  id: 930121
  name: "OS File Access Attempt: Strict directory traversal sequence (PL2)"
  layer: managed
  stage: request_body
  match:
    all:
      - operator:
          type: rx
          value: '(?i)(?:\.{2}[\\/]|(?:%2e%2e|\.%2e|%2e\.)[\\/]|(?:\.\.[\\/]){2,}|\b(?:etc[\\/]passwd|boot\.ini|windows[\\/]win\.ini)\b)'
        targets:
          - var: args
          - var: uri_raw
          - var: request_headers
            key: User-Agent
        transforms:
          - lowercase
          - url_decode_uni
  score: 100
  action_mode: score
  severity: critical
  paranoia_level: 2
  metadata:
    source: crs
    license: Apache-2.0
    author: OWASP CRS project
    upstream_id: "930121"
    upstream_version: "4.25.2"
    attack_type: path-traversal
    accuracy: high
    tags: [crs-pl2, lfi]
tests:
  match:
    - uri: /v1/download?file=../../../../etc/passwd
      headers: { Host: api.example.test, Accept: application/json }
    - uri: /v1/view?doc=%2e%2e%2f%2e%2e%2fwindows%2fwin.ini
      headers: { Host: api.example.test, Accept: application/json }
  no_match:
    - uri: /v1/download?file=annual-report-2026.pdf
      headers: { Host: api.example.test, Accept: application/json }
    - uri: /v1/docs?topic=relative-path-explanation
      headers: { Host: api.example.test, Accept: application/json }
