rules:
  - id: 922100
    name: Multipart content type global _charset_ definition is not allowed by policy
    layer: protocol
    stage: request_body
    match:
      all:
        - operator:
            type: gt
            value: 0
          targets:
            - count: true
              key: _charset_
              var: multipart_part_headers
        - operator:
            negate: true
            type: rx
            value: ^(?:utf-8|iso-8859-1|iso-8859-15|windows-1252)$
          targets:
            - key: _charset_
              var: args
          transforms:
            - lowercase
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: protocol
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "922100"
      upstream_version: 4.25.2
