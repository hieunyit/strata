# OWASP CRS 4.25.2, REQUEST-931-APPLICATION-ATTACK-RFI.conf: generated by tools/strata-import-crs, do not edit.
ir_version: 1
ruleset:
  name: crs-931-rfi
  version: 4.25.2
rules:
  - id: 931100
    name: 'Possible Remote File Inclusion (RFI) Attack: URL Parameter using IP Address'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?i)^(f(?:ile|tps?)|https?|ssh)://(?:\[?[0-9a-f]+:[0-:a-f]+\]?|[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})
          targets:
            - var: args
            - var: xml
            - var: xml_attributes
          transforms:
            - url_decode_uni
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: file-inclusion
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "931100"
      upstream_version: 4.25.2
  - id: 931110
    name: 'Possible Remote File Inclusion (RFI) Attack: Common RFI Vulnerable Parameter Name used w/URL Payload'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?i)(?:\binclude[\s\x0b]*\([^\)]*|mosConfig_absolute_path|(?:_(?:CONF\[path|SERVER\[DOCUMENT_ROOT)|path\[docroot|config\[root_dir)\]|GALLERY_BASEDIR|appserv_root)=(?:f(?:ile|tps?)|https?)://
          targets:
            - var: query_string
            - var: request_body
          transforms:
            - url_decode_uni
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: file-inclusion
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "931110"
      upstream_version: 4.25.2
  - id: 931120
    name: 'Possible Remote File Inclusion (RFI) Attack: URL Payload Used w/Trailing Question Mark Character (?)'
    layer: managed
    stage: request_body
    match:
      all:
        - operator:
            type: rx
            value: (?s)^(?i:file|ftps?|https?).*?\?+$
          targets:
            - var: args
    score: 100
    action_mode: score
    severity: critical
    paranoia_level: 1
    metadata:
      attack_type: file-inclusion
      author: OWASP CRS project
      license: Apache-2.0
      source: crs
      upstream_id: "931120"
      upstream_version: 4.25.2
  - id: 931131
    name: Possible Remote File Inclusion (RFI) Attack
    layer: managed
    stage: request_headers
    match:
      all:
        - operator:
            type: rx
            value: (?s)(?i)(?:(?:url|jar):)?(?:a(?:cap|f[ps]|ttachment)|b(?:eshare|itcoin|lob)|c(?:a(?:llto|p)|id|vs|ompress.(?:zlib|bzip2))|d(?:a(?:v|ta)|ict|n(?:s|tp))|e(?:d2k|xpect)|f(?:(?:ee)?d|i(?:le|nger|sh)|tps?)|g(?:it|o(?:pher)?|lob)|h(?:323|ttps?)|i(?:ax|cap|(?:ma|p)ps?|rc[6s]?)|ja(?:bbe)?r|l(?:dap[is]?|ocal_file)|m(?:a(?:ilto|ven)|ms|umble)|n(?:e(?:tdoc|ws)|fs|ntps?)|ogg|p(?:aparazzi|h(?:ar|p)|op(?:2|3s?)|r(?:es|oxy)|syc)|r(?:mi|sync|tm(?:f?p)?|ar)|s(?:3|ftp|ips?|m(?:[bs]|tps?)|n(?:ews|mp)|sh(?:2(?:.(?:s(?:hell|(?:ft|c)p)|exec|tunnel))?)?|vn(?:\+ssh)?)|t(?:e(?:amspeak|lnet)|ftp|urns?)|u(?:dp|nreal|t2004)|v(?:entrilo|iew-source|nc)|w(?:ebcal|ss?)|x(?:mpp|ri)|zip)://(?:[^@]+@)?([^/]*)
