rule:
  id: 500030
  name: "Automated brute force and credential stuffing tooling"
  layer: managed
  stage: request_headers
  match:
    all:
      - operator:
          type: rx
          value: '(?i)\b(?:hydra|medusa|patator|wfuzz|ffuf|burpcollaborator)\b'
        targets:
          - var: request_headers
            key: User-Agent
  score: 80
  action_mode: score
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    author: strata
    attack_type: bot
tests:
  match:
    - uri: /v1/auth/login
      headers:
        Host: api.example.test
        User-Agent: "wfuzz/3.1.0"
    - uri: /api/v1/sessions
      headers:
        Host: api.example.test
        User-Agent: "ffuf/2.1.0"
  no_match:
    - uri: /v1/auth/login
      headers:
        Host: api.example.test
        User-Agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15"
