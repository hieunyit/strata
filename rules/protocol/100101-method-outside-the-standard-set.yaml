# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100101
  name: Method outside the standard set
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: method
      operator:
        type: rx
        value: '^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$'
        negate: true
  score: 40
  action_mode: score
  severity: warning
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - method: PROPFIND
    uri: /dav/
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  - method: FOO
    uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: /v1/items
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  - method: PATCH
    uri: /v1/items/7
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      Content-Type: application/json
    body: '{"a":1}'
