# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100119
  name: More than 100 request headers
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
        count: true
      operator:
        type: gt
        value: 100
  score: 50
  action_mode: score
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
