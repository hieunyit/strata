# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100138
  name: X-Forwarded-Host with a character not allowed in a host
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
        key: X-Forwarded-Host
      operator:
        type: rx
        value: '[\s/\\?#@%\"''<>]'
  score: 50
  action_mode: score
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: other
tests:
  match:
  - uri: /reset
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      X-Forwarded-Host: evil.example/x
  no_match:
  - uri: /reset
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      X-Forwarded-Host: api.example.test
