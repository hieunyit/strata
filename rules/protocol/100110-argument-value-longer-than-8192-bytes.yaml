# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100110
  name: Argument value longer than 8192 bytes
  layer: protocol
  stage: request_body
  match:
    all:
    - targets:
      - var: args
      transforms:
      - length
      operator:
        type: gt
        value: 8192
  score: 20
  severity: notice
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - method: POST
    uri: /v1/notes
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      Content-Type: application/x-www-form-urlencoded
    body: ''
  no_match:
  - method: POST
    uri: /v1/notes
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      Content-Type: application/x-www-form-urlencoded
    body: ''
