# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100137
  name: Proxy request header (httpoxy)
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
        key: Proxy
        count: true
      operator:
        type: gt
        value: 0
  score: 100
  severity: critical
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: other
tests:
  match:
  - uri: /cgi-bin/x
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      Proxy: 'http://192.0.2.10:8080'
  no_match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      Proxy-Authorization: Basic eDp5
