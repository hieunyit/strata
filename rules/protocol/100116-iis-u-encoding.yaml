# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100116
  name: 'IIS %u encoding'
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: uri_raw
      operator:
        type: rx
        value: '(?i)%u[0-9a-f]{4}'
  score: 50
  action_mode: score
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: '/s?q=%u003cscript%u003e'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: '/s?q=%75'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
