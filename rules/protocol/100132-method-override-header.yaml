# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100132
  name: Method override header
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
        key: X-HTTP-Method-Override
        count: true
      operator:
        type: gt
        value: 0
  score: 20
  severity: notice
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: other
tests:
  match:
  - method: POST
    uri: /v1/items/7
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      X-HTTP-Method-Override: DELETE
  no_match:
  - method: POST
    uri: /v1/items/7
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
