# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100139
  name: TE request header other than trailers
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
        key: TE
      operator:
        type: rx
        value: '(?i)^\s*trailers\s*$'
        negate: true
  score: 20
  severity: notice
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      TE: chunked
  no_match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      TE: trailers
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
