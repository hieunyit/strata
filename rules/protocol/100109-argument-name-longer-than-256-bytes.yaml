# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100109
  name: Argument name longer than 256 bytes
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: args_names
      transforms:
      - length
      operator:
        type: gt
        value: 256
  score: 50
  action_mode: score
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: '/s?'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: '/s?nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn=1'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
