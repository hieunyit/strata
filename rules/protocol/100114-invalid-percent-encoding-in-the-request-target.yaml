# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100114
  name: Invalid percent-encoding in the request target
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: uri_raw
      operator:
        type: rx
        value: '%(?:[^0-9A-Fa-fUu]|[0-9A-Fa-f][^0-9A-Fa-f]|[0-9A-Fa-f]?$)'
  score: 50
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: '/s?q=50%zz'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  - uri: '/s?q=100%'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: '/s?q=%u003c'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
    name: '%u is 100116, not counted twice'
  - uri: '/s?q=50%25+off'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  - uri: '/caf%C3%A9'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
