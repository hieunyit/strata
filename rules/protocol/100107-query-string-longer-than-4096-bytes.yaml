# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100107
  name: Query string longer than 4096 bytes
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: query_string
      transforms:
      - length
      operator:
        type: gt
        value: 4096
  score: 30
  severity: warning
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: '/s?'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: '/s?'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
