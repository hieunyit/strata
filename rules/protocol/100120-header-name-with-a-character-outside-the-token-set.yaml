# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100120
  name: Header name with a character outside the token set
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers_names
      operator:
        type: rx
        value: '[^!#$%&''*+.^_`|~0-9A-Za-z-]'
  score: 50
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      X Bad: '1'
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      'X-Bad:': '1'
  no_match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      X_Under_Score: '1'
      X-Dash.Dot~: '1'
