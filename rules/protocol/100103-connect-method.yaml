# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100103
  name: CONNECT method
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: method
      operator:
        type: streq
        value: CONNECT
  score: 100
  severity: critical
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: other
tests:
  match:
  - method: CONNECT
    uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: /connect
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
