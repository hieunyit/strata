# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100123
  name: Host header with a character not allowed in a host
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
        key: Host
      operator:
        type: rx
        value: '[\s/\\?#%\"''<>]'
  score: 50
  action_mode: score
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: other
tests:
  match:
  - uri: /
    headers:
      Host: api.example.test/evil
      User-Agent: example-client/1.0
      Accept: application/json
  - uri: /
    headers:
      Host: api.example.test evil.example
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
