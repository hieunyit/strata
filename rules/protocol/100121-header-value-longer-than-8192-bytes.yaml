# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100121
  name: Header value longer than 8192 bytes
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
      transforms:
      - length
      operator:
        type: gt
        value: 8192
  score: 30
  severity: warning
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      X-Large: 
  no_match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      X-Large: 
