# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100112
  name: Backslash in the raw path
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: uri_raw
      operator:
        type: rx
        value: '(?i)^[^?#]*(?:\\|%5c)'
  score: 50
  severity: error
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: path-traversal
tests:
  match:
  - uri: '/static/..%5c..%5cwin.ini'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  - uri: '/a\b'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: '/s?q=a%5Cb'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
