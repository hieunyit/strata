# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100139
  name: TE request header lists chunked
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: request_headers
        key: TE
      operator:
        type: rx
        value: '(?i)(?:^|,)\s*chunked\s*(?:[;,]|$)'
  score: 20
  action_mode: block_alone
  severity: notice
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      TE: chunked
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      TE: 'trailers, chunked'
  no_match:
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      TE: trailers
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
      TE: 'trailers, deflate;q=0.5'
  - uri: /
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
