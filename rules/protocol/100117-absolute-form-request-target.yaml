# Strata protocol pack (W05-S-01); format: rules/schema/rule.schema.json.
rule:
  id: 100117
  name: Absolute-form request target
  layer: protocol
  stage: request_headers
  match:
    all:
    - targets:
      - var: uri_raw
      operator:
        type: rx
        value: '(?i)^[a-z][a-z0-9+.-]*://'
  score: 30
  severity: warning
  metadata:
    source: strata
    license: Apache-2.0
    attack_type: protocol
tests:
  match:
  - uri: 'http://internal.example.test/admin'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
  no_match:
  - uri: '/proxy?u=http://example.test/'
    headers:
      Host: api.example.test
      User-Agent: example-client/1.0
      Accept: application/json
