name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"   # nightly: adds the Valgrind run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: strata-dev:ci

jobs:
  rust:
    name: libstrata (fmt, clippy, test, ABI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      - name: fmt, clippy -D warnings, cargo test
        run: deploy/dev/run.sh make rust-check
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: strata.h is up to date with the Rust sources
        run: deploy/dev/run.sh make check-header
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Signed test fixtures are reproducible
        run: deploy/dev/run.sh make check-fixtures
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: C-side ABI test
        run: deploy/dev/run.sh make abi-test
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

  nginx:
    name: nginx ${{ matrix.nginx }} (${{ matrix.branch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - nginx: 1.30.5
            branch: stable
          - nginx: 1.31.6
            branch: mainline
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: Build NGINX + ngx_http_strata_module
        run: deploy/dev/run.sh make nginx NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Test::Nginx
        run: deploy/dev/run.sh make test-nginx NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ matrix.nginx }}-servroot
          path: connectors/nginx/t/servroot/logs/

  sanitizers:
    name: nginx ${{ matrix.nginx }} ASan+UBSan${{ github.event_name == 'schedule' && ' + Valgrind' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nginx: [1.30.5, 1.31.6]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: Test::Nginx under ASan + UBSan
        run: |
          deploy/dev/run.sh make nginx-asan NGINX_VERSION=${{ matrix.nginx }}
          deploy/dev/run.sh make test-nginx-asan NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Test::Nginx under Valgrind (nightly)
        if: github.event_name == 'schedule'
        timeout-minutes: 45
        run: |
          deploy/dev/run.sh make nginx NGINX_VERSION=${{ matrix.nginx }}
          deploy/dev/run.sh make test-nginx-valgrind NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Hot reload under load and event-loop syscalls (nightly)
        if: github.event_name == 'schedule'
        timeout-minutes: 15
        run: |
          deploy/dev/run.sh make check-strace NGINX_VERSION=${{ matrix.nginx }}
          deploy/dev/run.sh make bench-reload NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-${{ matrix.nginx }}
          path: |
            build/asan/
            build/valgrind.log
            connectors/nginx/t/servroot/logs/

  poc:
    name: Hyperscan mmap PoC (check only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: Compile a small pattern set and scan from shared mappings
        run: |
          deploy/dev/run.sh sh -c 'cd engine/poc/hs_mmap && make out/hs_mmap_poc \
            && out/hs_mmap_poc compile out 600 && out/hs_mmap_poc check out 4'
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}
