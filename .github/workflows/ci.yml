name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"   # nightly: adds the Valgrind run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: strata-dev:ci

jobs:
  rust:
    name: libstrata (fmt, clippy, test, ABI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      - name: fmt, clippy -D warnings, cargo test
        run: deploy/dev/run.sh make rust-check
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: strata.h is up to date with the Rust sources
        run: deploy/dev/run.sh make check-header
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Signed test fixtures are reproducible
        run: deploy/dev/run.sh make check-fixtures
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: C-side ABI test
        run: deploy/dev/run.sh make abi-test
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

  go:
    name: Go (agent, control-plane, e2e) and proto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: buf lint, generated code is up to date
        run: deploy/dev/run.sh make check-proto
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: go vet, go test -race, golangci-lint
        run: deploy/dev/run.sh make test-go
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

  rules:
    name: Rules (tests and corpus report through libstrata)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: make test-rules
        run: deploy/dev/run.sh make test-rules
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: rules/crs, the CRS inventory and go-ftw tests are generated from the pinned CRS
        run: |
          deploy/dev/run.sh sh -c 'make crs-import crs-inventory crs-ftw'
          git diff --exit-code -- rules/crs docs/crs-import-report.md docs/crs-inventory.csv corpus/crs-ftw docs/crs-ftw-unconverted.md

      - name: CRS go-ftw tests of the injection groups pass at least 90% (and the report is current)
        run: |
          deploy/dev/run.sh make test-crs-ftw
          git diff --exit-code -- docs/crs-ftw-report.md
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: FP and recall, compared with the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add build/base "origin/${{ github.base_ref }}"
          deploy/dev/run.sh sh -c 'cd tools/strata-rules && \
            go run . report --repo ../.. --rules ../../build/base/rules --json ../../build/report-base.json >/dev/null && \
            go run . report --repo ../.. --baseline ../../build/report-base.json' >> "$GITHUB_STEP_SUMMARY"
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

  ui:
    name: Web UI (lint, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  e2e:
    name: e2e (agent restart, enrollment, policy deploy; PostgreSQL, MinIO, ClickHouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: make e2e-go
        run: make e2e-go

  lab:
    name: Lab (make lab-up, lab-smoke; nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: make lab-up
        run: make lab-up

      - name: make lab-smoke
        run: make lab-smoke

      - name: make e2e-lab (policy -> bundle -> NGINX blocks)
        run: make e2e-lab

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI on the lab (Keycloak sign-in, decision trace)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:lab

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/lab/compose.yaml --env-file deploy/lab/.state/env logs --no-color --tail 200

      - name: make lab-clean
        if: always()
        run: make lab-clean

  nginx:
    name: nginx ${{ matrix.nginx }} (${{ matrix.branch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - nginx: 1.30.5
            branch: stable
          - nginx: 1.31.6
            branch: mainline
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: Build NGINX + ngx_http_strata_module
        run: deploy/dev/run.sh make nginx NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Test::Nginx
        run: deploy/dev/run.sh make test-nginx NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ matrix.nginx }}-servroot
          path: connectors/nginx/t/servroot/logs/

  sanitizers:
    name: nginx ${{ matrix.nginx }} ASan+UBSan${{ github.event_name == 'schedule' && ' + Valgrind' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nginx: [1.30.5, 1.31.6]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: Test::Nginx under ASan + UBSan
        run: |
          deploy/dev/run.sh make nginx-asan NGINX_VERSION=${{ matrix.nginx }}
          deploy/dev/run.sh make test-nginx-asan NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Test::Nginx under Valgrind (nightly)
        if: github.event_name == 'schedule'
        timeout-minutes: 45
        run: |
          deploy/dev/run.sh make nginx NGINX_VERSION=${{ matrix.nginx }}
          deploy/dev/run.sh make test-nginx-valgrind NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Hot reload under load and event-loop syscalls (nightly)
        if: github.event_name == 'schedule'
        timeout-minutes: 15
        run: |
          deploy/dev/run.sh make check-strace NGINX_VERSION=${{ matrix.nginx }}
          deploy/dev/run.sh make bench-reload NGINX_VERSION=${{ matrix.nginx }}
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-${{ matrix.nginx }}
          path: |
            build/asan/
            build/valgrind.log
            connectors/nginx/t/servroot/logs/

  poc:
    name: Hyperscan mmap PoC (check only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: deploy/dev
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=dev-image

      - name: Compile a small pattern set and scan from shared mappings
        run: |
          deploy/dev/run.sh sh -c 'cd engine/poc/hs_mmap && make out/hs_mmap_poc \
            && out/hs_mmap_poc compile out 600 && out/hs_mmap_poc check out 4'
        env:
          STRATA_DEV_IMAGE: ${{ env.IMAGE }}
