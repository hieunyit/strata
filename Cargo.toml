[workspace]
resolver = "3"
members = ["engine", "engine/ffi", "engine/compiler", "engine/tools/mkbundle"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[profile.dev]
panic = "unwind"

[profile.release]
# Panics must unwind so every extern "C" entry point can catch them
# (design: "Lỗi và panic"); never switch this to "abort".
panic = "unwind"
codegen-units = 1
debug = "line-tables-only"

# Signature checks in unit tests are slow unoptimized.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
