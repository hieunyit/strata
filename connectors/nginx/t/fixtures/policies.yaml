# Policies of the test bundles (strata-compile input). example-api enforces
# the signature pack too (RV-S-01): the suites check the connector with the
# sample Sigma and bot rules scoring like any other rule.
policies:
  - { name: example-api, mode: enforce, oversize: block, signatures: enforce }
  - { name: example-api-upload, mode: shadow }
  - { name: example-web, mode: shadow, oversize: pass }
  - name: example-guard
    mode: enforce
    response: { allowed_codes_check: true, db_errors: true, data_guard: [cccd, jwt] }
block_page:
  html_file: block-bundle.html
  support_contact: "Support: support@example.test"
