openapi: 3.0.3
info:
  title: Strata Control Plane API
  version: 1.0.0
  description: 'Security event API of the Strata control plane (plain HTTP handlers). The admin API (version, fleet,
    policies) is generated from the protos into admin.swagger.json. Every route except /v1/auth/methods and /v1/auth/login
    needs a bearer token in Authorization: an OIDC access token (audience strata-api, roles from realm_access.roles)
    or, with -local-auth, a local session token (stl_ prefix) from POST /v1/auth/login. Machine credentials (stsa_) use the same header when the durable machine authenticator is configured; query credentials are not accepted.'
paths:
  /v1/rules/staging-actions:
    get:
      operationId: listRuleStagingNotices
      summary: Read durable automatic staging notices for reviewers
      description: Requires policies:approve (approver or admin). Historical signed-bundle intent and rollout state, not current runtime protection or proof of node activation. Read-only; no acknowledgment or re-enforcement. Decimal strings preserve 64-bit counts and versions. Keyset pagination is independent of audit traffic. Maximum 1024-byte query; unknown/repeated parameters rejected.
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      - name: cursor
        in: query
        schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: Durable notices with Cache-Control no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleStagingNoticePage'}
        '400': {description: Invalid cursor, limit or query parameters.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Optional durable store is not configured.}
        '405': {description: GET required.}
        '503': {description: Durable notices unavailable; no database details returned.}
  /v1/rules/{rule_id}/health:
    get:
      operationId: getRuleHealth
      summary: Read observed rule telemetry
      description: Requires events:read and both ClickHouse and PostgreSQL. Read-only; no quarantine or enforcement changes. Counts deduplicated events containing the rule and human-reported FP events containing it, which does not attribute blame to an individual rule. Cost covers only top-eight timings received in sampled security events, not all traffic. Unknown/empty telemetry is insufficient, not healthy. Each replica permits four concurrent queries with a shared five-second deadline. Query string at most 2048 bytes; unknown/repeated parameters and malformed URL encoding are rejected.
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
      - name: policy_id
        in: query
        description: Empty or omitted means all policies.
        schema: {type: string, maxLength: 55, pattern: '^[a-z0-9._-]{0,55}$'}
      - name: from
        in: query
        description: Inclusive RFC3339 boundary; default five minutes before to. Window must be positive and at most 24 hours.
        schema: {type: string, format: date-time}
      - name: to
        in: query
        description: Exclusive RFC3339 boundary; default now.
        schema: {type: string, format: date-time}
      responses:
        '200':
          description: Observations returned with Cache-Control no-store; status describes data consistency, not protection health.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleHealth'}
        '400': {description: Invalid rule ID, timestamp, window or query parameters.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Optional telemetry service is not configured.}
        '405': {description: GET required.}
        '503':
          description: Telemetry source unavailable or query capacity reached; busy responses include Retry-After 1. Errors are not returned as zero counts.
  /v1/exceptions:fromBlockId:
    post:
      operationId: createExceptionFromBlock
      summary: Create a policy exception draft from a blocked event
      description: Requires exceptions:write. Select the exact recorded Rule ID and field; method, Host, path and policy are derived from the stored event. Only managed rules and unambiguous ARGS or REQUEST_HEADERS fields are accepted. TTL is mandatory. Draft, audit, idempotent response and replay queue commit together. Creation does not activate the exception; use the returned policy version in the normal submit/four-eyes/deploy flow. Retry with identical request_id and body returns the original draft even after event retention. Duplicate active scope and decoder alias fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExceptionFromBlockRequest'}
      responses:
        '200':
          description: Draft and replay queue persisted; original response on retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExceptionDraftResponse'}
        '400': {description: Invalid, missing or excessive input.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Event or policy not found.}
        '405': {description: POST required.}
        '409': {description: Stale etag, reused request_id, duplicate active scope, unmanaged rule or ambiguous/mismatched field.}
        '503': {description: Durable store or replay runner unavailable.}
  /v1/events/{block_id}:
    get:
      summary: Get Event by Block ID
      description: Retrieve the detailed decision trace and violations for a specific Block ID.
      operationId: getEvent
      parameters:
      - name: block_id
        in: path
        required: true
        description: Unique Block ID (e.g. STR-8F3K-Q2VD-7XNM-A1PC or EVT-xxxx)
        schema:
          type: string
          pattern: ^(STR|EVT)-[0-9A-HJ-NP-Z]{4}-[0-9A-HJ-NP-Z]{4}-[0-9A-HJ-NP-Z]{4}-[0-9A-HJ-NP-Z]{4}$
      responses:
        '200':
          description: Event found and returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventResponse'
        '400':
          description: Invalid Block ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/events/{block_id}:markFalsePositive:
    post:
      summary: Mark an event as a false positive
      description: Requires exceptions:write and durable PostgreSQL annotations. Creation uses an empty etag; editing requires the current annotation etag. request_id makes retries idempotent per authenticated subject. Classification does not change enforcement.
      operationId: markFalsePositive
      parameters:
      - name: block_id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
                request_id: {type: string, maxLength: 128}
                etag: {type: string}
      responses:
        '200':
          description: Annotation and audit persisted.
          content:
            application/json:
              schema:
                type: object
                required: [block_id, false_positive, reason, marked_by, marked_at, etag]
                properties:
                  block_id: {type: string}
                  false_positive: {type: boolean}
                  reason: {type: string}
                  marked_by: {type: string}
                  marked_at: {type: string, format: date-time}
                  etag: {type: string}
        '400': {description: Invalid body or reused request_id with different content.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Event not found.}
        '405': {description: POST required.}
        '409': {description: Annotation etag changed.}
        '503': {description: Durable store unavailable or not configured.}
  /v1/events:search:
    post:
      summary: Search Security Events
      description: Search and filter events across time, IP, action, policy, rules, and nodes.
      operationId: searchEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEventsRequest'
      responses:
        '200':
          description: List of matched events and pagination token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEventsResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/stats/overview:
    get:
      summary: Overview Statistics
      description: 'Events of a window by time bucket and action, totals, top rules, top routes and, for callers who
        may read full client IPs, top clients (W10-F-01). Needs events:read; top_clients is left out without
        events:read_sensitive. Event queries collapse retries with the same block_id and timestamp before counting.'
      operationId: getOverview
      parameters:
      - name: from
        in: query
        description: Start of the window, RFC 3339. Default 24 hours before to.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: End of the window (exclusive), RFC 3339. Default now. The window is at most 31 days.
        schema:
          type: string
          format: date-time
      - name: policy_id
        in: query
        description: Only the events of this policy.
        schema:
          type: string
      - name: step
        in: query
        description: Bucket width of the series. Default 1h up to 48 hours, 6h up to 8 days, 24h beyond. Buckets are
          aligned in UTC.
        schema:
          type: string
          enum:
          - 1h
          - 6h
          - 24h
      responses:
        '200':
          description: Statistics of the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '400':
          description: Invalid window or step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: The event store does not aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/methods:
    get:
      summary: Sign-in Methods
      description: How the console may sign in. Needs no token.
      operationId: getAuthMethods
      security: []
      responses:
        '200':
          description: The methods this control plane accepts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethods'
  /v1/auth/login:
    post:
      summary: Local Sign-in
      description: 'Signs in a local account (control plane flag -local-auth). Returns a bearer token prefixed stl_,
        valid until expires_at. Five wrong passwords in a row lock the account for 15 minutes; a client IP may try
        20 times per 5 minutes. The answer does not tell an unknown user from a wrong password or a locked account.
        Needs no token.'
      operationId: localLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalSession'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Wrong username or password, or the account is disabled or locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts from this address (Retry-After).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/logout:
    post:
      summary: Local Sign-out
      description: Ends the caller's local session. Does nothing for an OIDC token.
      operationId: localLogout
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/me:
    get:
      summary: Current Caller
      description: The caller as the API sees it (any valid token).
      operationId: getMe
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/password:
    post:
      summary: Change Own Password
      description: A local account changes its password; its other sessions end.
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          description: Wrong current password, weak new password, or not a local account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users:
    get:
      summary: List Local Accounts
      description: Needs rolebindings:read.
      operationId: listUsers
      responses:
        '200':
          description: Every local account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create Local Account
      description: Needs rolebindings:write. Written to the audit log.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid username, password or roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The username is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/users/{username}:
    parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get Local Account
      description: Needs rolebindings:read.
      operationId: getUser
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: Update Local Account
      description: 'Changes roles, disables or enables, sets a new password or unlocks. Disabling or a new password
        ends the account''s sessions. Refused when it would leave no enabled admin. Needs rolebindings:write.'
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid password or roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: It would leave no enabled admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Delete Local Account
      description: Refused when it would leave no enabled admin. Needs rolebindings:write.
      operationId: deleteUser
      responses:
        '204':
          description: Deleted.
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: It would leave no enabled admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: List machine accounts (admin)
      responses:
        '200':
          description: Committed receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccountList'}
        '400': {$ref: '#/components/responses/MachineInvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MachineConflict'}
        '500': {$ref: '#/components/responses/MachineFailure'}
        '503': {$ref: '#/components/responses/MachineUnavailable'}
        '404': {$ref: '#/components/responses/MachineMissing'}
    post:
      operationId: createServiceAccount
      summary: Create account with atomic audit and retry receipt
      responses:
        '201':
          description: Committed receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
        '400': {$ref: '#/components/responses/MachineInvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MachineConflict'}
        '500': {$ref: '#/components/responses/MachineFailure'}
        '503': {$ref: '#/components/responses/MachineUnavailable'}
        '404': {$ref: '#/components/responses/MachineMissing'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountCreateRequest'}
  /v1/service-accounts/{account_id}:
    get:
      operationId: getServiceAccount
      summary: Read current machine account metadata
      responses:
        '200':
          description: Committed receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
        '404': {$ref: '#/components/responses/MachineMissing'}
        '400': {$ref: '#/components/responses/MachineInvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MachineConflict'}
        '500': {$ref: '#/components/responses/MachineFailure'}
        '503': {$ref: '#/components/responses/MachineUnavailable'}
      parameters:
      - {$ref: '#/components/parameters/MachineAccountID'}
    delete:
      operationId: deleteServiceAccount
      summary: Delete account and invalidate all its tokens atomically
      responses:
        '204':
          description: Committed or identical command replay
        '400': {$ref: '#/components/responses/MachineInvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MachineConflict'}
        '500': {$ref: '#/components/responses/MachineFailure'}
        '503': {$ref: '#/components/responses/MachineUnavailable'}
        '404': {$ref: '#/components/responses/MachineMissing'}
      parameters:
      - {$ref: '#/components/parameters/MachineAccountID'}
      - {$ref: '#/components/parameters/MachineIfMatch'}
      - {$ref: '#/components/parameters/MachineRequestID'}
  /v1/service-accounts/{account_id}/tokens:
    get:
      operationId: listServiceAccountTokens
      summary: List token metadata, never plaintext or hashes
      responses:
        '200':
          description: Committed receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccountTokenList'}
        '400': {$ref: '#/components/responses/MachineInvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MachineConflict'}
        '500': {$ref: '#/components/responses/MachineFailure'}
        '503': {$ref: '#/components/responses/MachineUnavailable'}
        '404': {$ref: '#/components/responses/MachineMissing'}
      parameters:
      - {$ref: '#/components/parameters/MachineAccountID'}
    post:
      operationId: createServiceAccountToken
      summary: Issue a scoped token; plaintext returned only on first commit
      responses:
        '201':
          description: Committed receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MachineTokenResponse'}
        '200':
          description: Committed receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MachineTokenResponse'}
        '400': {$ref: '#/components/responses/MachineInvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MachineConflict'}
        '500': {$ref: '#/components/responses/MachineFailure'}
        '503': {$ref: '#/components/responses/MachineUnavailable'}
        '404': {$ref: '#/components/responses/MachineMissing'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MachineTokenRequest'}
      parameters:
      - {$ref: '#/components/parameters/MachineAccountID'}
  /v1/service-accounts/{account_id}/tokens/{token_id}:
    delete:
      operationId: revokeServiceAccountToken
      summary: Revoke token with etag and immutable retry command
      responses:
        '204':
          description: Committed or identical command replay
        '400': {$ref: '#/components/responses/MachineInvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/MachineConflict'}
        '500': {$ref: '#/components/responses/MachineFailure'}
        '503': {$ref: '#/components/responses/MachineUnavailable'}
        '404': {$ref: '#/components/responses/MachineMissing'}
      parameters:
      - {$ref: '#/components/parameters/MachineAccountID'}
      - {$ref: '#/components/parameters/MachineIfMatch'}
      - {$ref: '#/components/parameters/MachineRequestID'}
      - {$ref: '#/components/parameters/MachineTokenID'}
components:
  parameters:
    MachineAccountID:
      name: account_id
      in: path
      required: true
      schema: {type: string, minLength: 2, maxLength: 64, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{1,63}$'}
    MachineIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    MachineRequestID:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    MachineTokenID:
      name: token_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  schemas:
    ServiceAccount:
      type: object
      required:
      - id
      - etag
      - name
      - roles
      - created_at
      - created_by
      properties:
        id: {type: string, maxLength: 64, minLength: 2, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{1,63}$'}
        etag: {type: string, maxLength: 128}
        name: {type: string, maxLength: 128}
        description: {type: string, maxLength: 2048}
        roles:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string, enum: [viewer, operator, approver, admin]}
        created_at: {type: string, format: date-time}
        created_by: {type: string, maxLength: 128}
        token_count: {type: integer, minimum: 0}
    ServiceAccountCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - request_id
      properties:
        id: {type: string, maxLength: 64, minLength: 2, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{1,63}$'}
        name: {type: string, maxLength: 128, minLength: 1}
        description: {type: string, maxLength: 2048}
        roles:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string, enum: [viewer, operator, approver, admin]}
        request_id: {type: string, minLength: 1, maxLength: 128}
    ServiceAccountToken:
      type: object
      required:
      - id
      - etag
      - service_account_id
      - token_prefix
      - scopes
      - expires_at
      - created_at
      - revoked
      properties:
        id: {type: string, maxLength: 128}
        etag: {type: string, maxLength: 128}
        service_account_id: {type: string, maxLength: 64}
        token_prefix: {type: string, maxLength: 128}
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string, enum: ['version:read', 'events:read', 'events:read_sensitive', 'policies:read',
              'policies:write', 'policies:approve', 'policies:deploy', 'rules:disable', 'replay:configure', 'exceptions:write',
              'nodes:read', 'nodes:write', 'rolebindings:read', 'rolebindings:write', 'serviceaccounts:read', 'serviceaccounts:write',
              'audit:read']}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        revoked: {type: boolean}
    MachineTokenRequest:
      type: object
      additionalProperties: false
      required:
      - scopes
      - request_id
      - etag
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string, enum: ['version:read', 'events:read', 'events:read_sensitive', 'policies:read',
              'policies:write', 'policies:approve', 'policies:deploy', 'rules:disable', 'replay:configure', 'exceptions:write',
              'nodes:read', 'nodes:write', 'rolebindings:read', 'rolebindings:write', 'serviceaccounts:read', 'serviceaccounts:write',
              'audit:read']}
        ttl_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 31536000
          description: Zero or omitted defaults to 30 days; negatives rejected before duration conversion.
        request_id: {type: string, minLength: 1, maxLength: 128}
        etag: {type: string, maxLength: 128}
    MachineTokenResponse:
      type: object
      required:
      - token
      description: Retry returns replayed=true and no plaintext. Revoke and issue a new command if the first plaintext
        receipt was lost. No plaintext is stored in audit or idempotency records.
      properties:
        token: {$ref: '#/components/schemas/ServiceAccountToken'}
        raw_token: {type: string, writeOnly: false}
        replayed: {type: boolean}
    ServiceAccountList:
      type: object
      required:
      - service_accounts
      properties:
        service_accounts:
          type: array
          items: {$ref: '#/components/schemas/ServiceAccount'}
    ServiceAccountTokenList:
      type: object
      required:
      - tokens
      properties:
        tokens:
          type: array
          items: {$ref: '#/components/schemas/ServiceAccountToken'}
    RuleStagingNoticePage:
      type: object
      required: [notices, next_cursor]
      properties:
        notices:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/RuleStagingNotice'}
        next_cursor: {type: string, description: Empty means end of history.}
    RuleStagingNotice:
      type: object
      required: [id, policy_id, policy_name, policy_version, rule_id, source_bundle, bundle_version, matches, reports, window_from, window_to, created_at, rollout_id, rollout_state]
      properties:
        id: {type: string, maxLength: 128}
        policy_id: {type: string}
        policy_name: {type: string}
        policy_version: {type: integer, minimum: 1}
        rule_id: {type: integer, minimum: 1, maximum: 4294967295}
        source_bundle: {type: string, pattern: '^[0-9]+$', maxLength: 20}
        bundle_version: {type: string, pattern: '^[0-9]+$', maxLength: 20}
        matches: {type: string, pattern: '^[0-9]+$', maxLength: 20}
        reports: {type: string, pattern: '^[0-9]+$', maxLength: 20}
        window_from: {type: string, format: date-time}
        window_to: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        rollout_id: {type: string, description: Empty before rollout creation.}
        rollout_state:
          type: string
          enum: [PENDING, RUNNING, PAUSED, FAILED, DONE, ABORTED]
          description: Publication history only. DONE is not a claim of current runtime protection.
    RuleHealth:
      type: object
      required: [rule_id, from, to, status, matched_events, reported_fp_events, reported_fp_share, cost_source, cost_samples, cost_total_ns, cost_mean_ns]
      properties:
        rule_id: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
        policy_id: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        status: {type: string, enum: [observing, insufficient_telemetry, inconsistent_snapshot]}
        matched_events: {type: integer, format: int64, minimum: 0}
        reported_fp_events:
          type: integer
          format: int64
          minimum: 0
          description: Annotated FP events containing this rule; multi-rule events do not prove this rule caused the FP. Legacy annotations lacking source snapshots are not counted.
        reported_fp_share:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Reported FP events divided by matched events; null for no matches or inconsistent snapshots. Not a ground-truth FP rate.
        cost_source: {type: string, enum: [sampled_security_events_top8]}
        cost_samples: {type: string, pattern: '^[0-9]+$', description: Exact observed sample sum as a decimal string.}
        cost_total_ns: {type: string, pattern: '^[0-9]+$', description: Exact observed nanosecond sum as a decimal string.}
        cost_mean_ns: {type: number, nullable: true, minimum: 0, description: Approximate mean in the received top-eight event samples; null when no samples were received.}
    ExceptionFromBlockRequest:
      type: object
      additionalProperties: false
      required: [block_id, rule_id, field, reason, ttl_seconds, etag, request_id]
      properties:
        block_id: {type: string, pattern: '^STR-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$'}
        rule_id: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
        field: {type: string, minLength: 1, maxLength: 160}
        reason: {type: string, minLength: 1, maxLength: 500}
        ttl_seconds: {type: integer, format: int64, minimum: 60, maximum: 2592000}
        etag: {type: string, minLength: 1, maxLength: 128}
        request_id: {type: string, minLength: 1, maxLength: 128}
    PolicyException:
      type: object
      required: [id, rule_id, method, host, path, field, expires_unix_ms, reason]
      properties:
        id: {type: string, pattern: '^exc-[a-f0-9]{32}$'}
        rule_id: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
        method: {type: string}
        host: {type: string}
        path: {type: string}
        field: {type: string}
        expires_unix_ms: {type: integer, format: int64, minimum: 1}
        reason: {type: string}
        source_block_id: {type: string}
    ExceptionDraftResponse:
      type: object
      required: [exception, policy_id, policy_version, etag, state, replay_url]
      properties:
        exception: {$ref: '#/components/schemas/PolicyException'}
        policy_id: {type: string}
        policy_version: {type: integer, minimum: 1}
        etag: {type: string}
        state: {type: string, enum: [DRAFT]}
        replay_url: {type: string}
    Violation:
      type: object
      required:
      - rule_id
      - layer
      - field
      - snippet
      properties:
        rule_id:
          type: integer
          format: int64
          description: Numeric Rule ID that triggered the violation.
          example: 100001
        layer:
          type: string
          description: Detection layer that identified the violation (protocol, sqli, xss, etc.).
          example: protocol
        field:
          type: string
          description: Request target field (e.g. uri.query, header.user-agent, body.json).
          example: uri.query.q
        snippet:
          type: string
          description: Matched raw or normalized snippet (redacted for viewer role).
          example: STRATA-TEST-BLOCK
    Event:
      type: object
      required:
      - block_id
      - timestamp
      - node_id
      - connector_type
      - policy_id
      - policy_version
      - client_ip
      - http_method
      - http_host
      - http_path
      - status_code
      - action
      properties:
        block_id:
          type: string
          example: STR-8F3K-Q2VD-7XNM-A1PC
        timestamp:
          type: string
          format: date-time
        node_id:
          type: string
          example: edge-worker-01
        connector_type:
          type: string
          example: nginx
        policy_id:
          type: string
          example: example-api
        policy_version:
          type: integer
          format: int64
          example: 1
        client_ip:
          type: string
          example: 192.168.1.50
        identity:
          type: string
          example: anon
        request_id:
          type: string
          example: 9a3e21cb-4d89-4fa2-bf41-6e3e579bd66c
        http_method:
          type: string
          example: GET
        http_host:
          type: string
          example: api.example.test
        http_path:
          type: string
          example: /t
        status_code:
          type: integer
          example: 403
        action:
          type: string
          enum:
          - block
          - shadow
          - allow
          - pass
          - error
          - pass
          - error
          example: block
        score_protocol:
          type: integer
          example: 20
        score_sqli:
          type: integer
          example: 0
        score_xss:
          type: integer
          example: 0
        score_anomaly:
          type: integer
          example: 20
        matched_rules:
          type: array
          items:
            type: integer
          example:
          - 100001
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        received_at:
          type: string
          format: date-time
        user_agent:
          type: string
          description: User-Agent of the request, at most 512 bytes, masked like snippets (RV-G2-01). Only in GET
            /v1/events/{block_id}; absent for events of modules from before it.
        referer:
          type: string
          description: Referer of the request, at most 512 bytes; values of sensitive query parameters are [MASKED].
            [REDACTED] for callers without events:read_sensitive. Only in GET /v1/events/{block_id}.
        headers:
          type: array
          description: Other request headers, at most 32 and 2 KB; values of sensitive headers (Authorization, Cookie,
            X-Api-Key, the policy's privacy.sensitive_fields...) are [MASKED], others masked like snippets. Values are
            [REDACTED] for callers without events:read_sensitive. Only in GET /v1/events/{block_id}.
          items:
            $ref: '#/components/schemas/Header'
        inspection:
          type: string
          description: 'How much of the request was inspected (RV-N-01): full; partial (the CPU budget ran out, the
            fail mode applied); body_skipped (the body, or part of it, was not inspected). Empty for modules from
            before it.'
          enum:
          - ''
          - full
          - partial
          - body_skipped
        false_positive: {type: boolean, readOnly: true}
        false_positive_reason: {type: string, readOnly: true}
        false_positive_by: {type: string, readOnly: true}
        false_positive_at: {type: string, format: date-time, readOnly: true}
        annotation_etag: {type: string, readOnly: true}
    Header:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
        value:
          type: string
    GetEventResponse:
      type: object
      required:
      - event
      properties:
        event:
          $ref: '#/components/schemas/Event'
        rules:
          type: object
          description: What the rule catalog (the rules compiled into bundles) knows about the event's rules, keyed by Rule ID. Absent when the control plane has no catalog.
          additionalProperties:
            $ref: '#/components/schemas/RuleInfo'
    RuleInfo:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        layer:
          type: string
        severity:
          type: string
        source:
          type: string
          description: Where the rule comes from (strata, owasp-crs, sigma, et-open, bots, organization).
        author:
          type: string
          description: Author of the rule as its source credits it (Sigma rules).
        license:
          type: string
    SearchEventsRequest:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        policy_id:
          type: string
        action:
          type: string
          enum:
          - block
          - shadow
          - allow
          - pass
          - error
          - pass
          - error
        client_ip:
          type: string
        rule_id:
          type: integer
        node_id:
          type: string
        http_method:
          type: string
        page_size:
          type: integer
          default: 50
        page_token:
          type: string
    SearchEventsResponse:
      type: object
      required:
      - events
      - total_matched
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_page_token:
          type: string
        total_matched:
          type: integer
          format: int64
    OverviewBucket:
      type: object
      required: [start, block, shadow, other, error]
      properties:
        start:
          type: string
          format: date-time
        block:
          type: integer
          format: int64
        shadow:
          type: integer
          format: int64
        error:
          type: integer
          format: int64
          description: 'Of other, the events in fail mode (CPU budget, oversize body, engine error): the request was not inspected.'
        other:
          type: integer
          format: int64
          description: pass and error
    OverviewTotals:
      type: object
      required: [events, block, shadow, other, error, clients, nodes, policies]
      properties:
        events:
          type: integer
          format: int64
        block:
          type: integer
          format: int64
        shadow:
          type: integer
          format: int64
        other:
          type: integer
          format: int64
        error:
          type: integer
          format: int64
          description: 'Of other, the events in fail mode (not inspected).'
        clients:
          type: integer
          format: int64
          description: Distinct client IPs (approximate for large sets).
        nodes:
          type: integer
          format: int64
        policies:
          type: integer
          format: int64
    OverviewRuleCount:
      type: object
      required: [rule_id, events, block, shadow]
      properties:
        rule_id:
          type: integer
        events:
          type: integer
          format: int64
          description: Events that matched the rule; an event matching it several times counts once.
        block:
          type: integer
          format: int64
        shadow:
          type: integer
          format: int64
    OverviewRouteCount:
      type: object
      required: [policy_id, host, path_prefix, events, block, shadow, error]
      properties:
        policy_id:
          type: string
        host:
          type: string
        path_prefix:
          type: string
          description: The path without its query, first two segments (/v1/verify).
        events:
          type: integer
          format: int64
        block:
          type: integer
          format: int64
        shadow:
          type: integer
          format: int64
        error:
          type: integer
          format: int64
          description: 'Events in fail mode on the route (not inspected).'
    OverviewClientCount:
      type: object
      required: [client_ip, events, block]
      properties:
        client_ip:
          type: string
        events:
          type: integer
          format: int64
        block:
          type: integer
          format: int64
    OverviewPolicyInspection:
      type: object
      description: >-
        One policy's requests over the window, from the nodes' counters
        (RV-N-01), and of them the ones not fully inspected: the fail mode
        decided (CPU budget, body not inspected, engine error).
      required: [policy_id, requests, not_inspected, partial, body_skipped, error, degraded, share]
      properties:
        policy_id:
          type: string
          description: Empty for requests whose strata_policy the node's bundle does not have.
        requests:
          type: integer
          format: int64
        not_inspected:
          type: integer
          format: int64
          description: partial + body_skipped + error.
        partial:
          type: integer
          format: int64
          description: The CPU budget ran out.
        body_skipped:
          type: integer
          format: int64
          description: The body, or part of it, was not inspected.
        error:
          type: integer
          format: int64
          description: Another engine error.
        degraded:
          type: integer
          format: int64
          description: Requests the worker's circuit breaker ran degraded (also counted in requests).
        share:
          type: number
          format: double
          description: not_inspected / requests (0 without requests).
    OverviewResponse:
      type: object
      required: [from, to, step_seconds, totals, series, top_rules, top_routes, inspection]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        step_seconds:
          type: integer
          format: int64
        totals:
          $ref: '#/components/schemas/OverviewTotals'
        series:
          type: array
          description: One bucket per step from the bucket holding from to the one before to, zeros included.
          items:
            $ref: '#/components/schemas/OverviewBucket'
        top_rules:
          type: array
          items:
            $ref: '#/components/schemas/OverviewRuleCount'
        top_routes:
          type: array
          items:
            $ref: '#/components/schemas/OverviewRouteCount'
        inspection:
          type: array
          description: Per policy, the most requests first (at most 10); empty before the nodes send counters (module and agent from RV-N-01).
          items:
            $ref: '#/components/schemas/OverviewPolicyInspection'
        top_clients:
          type: array
          description: Absent for callers without events:read_sensitive.
          items:
            $ref: '#/components/schemas/OverviewClientCount'
        rules:
          type: object
          description: Rule catalog entries of the top rules, keyed by Rule ID.
          additionalProperties:
            $ref: '#/components/schemas/RuleInfo'
    AuthMethods:
      type: object
      required:
      - local
      - oidc
      properties:
        local:
          type: boolean
          description: Local accounts (POST /v1/auth/login) are accepted.
        oidc:
          type: boolean
          description: OIDC access tokens are accepted.
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    LocalSession:
      type: object
      required:
      - token
      - expires_at
      - username
      - roles
      properties:
        token:
          type: string
          description: Bearer token, prefixed stl_.
        expires_at:
          type: string
          format: date-time
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - viewer
            - operator
            - approver
            - admin
    Me:
      type: object
      required:
      - username
      - roles
      - local
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        local:
          type: boolean
          description: A local account, which may change its password with POST /v1/auth/password.
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: 12 to 256 characters.
    User:
      type: object
      required:
      - username
      - roles
      - disabled
      - locked
      - created_at
      - created_by
      - updated_at
      - password_changed_at
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - viewer
            - operator
            - approver
            - admin
        disabled:
          type: boolean
        locked:
          type: boolean
          description: Locked after wrong passwords, until the lock expires or an admin unlocks it.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        password_changed_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    ListUsersResponse:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CreateUserRequest:
      type: object
      required:
      - username
      - password
      - roles
      properties:
        username:
          type: string
          description: 2 to 63 characters, lowercase letters, digits, dot, dash or underscore.
        password:
          type: string
          description: 12 to 256 characters.
        roles:
          type: array
          items:
            type: string
            enum:
            - viewer
            - operator
            - approver
            - admin
    UpdateUserRequest:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - viewer
            - operator
            - approver
            - admin
        disabled:
          type: boolean
        password:
          type: string
          description: A new password set by an admin.
        unlock:
          type: boolean
          description: Clears a lock after wrong passwords.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        block_id:
          type: string
        code:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    MachineInvalidInput:
      description: Invalid bounded command; creates require request_id. No mutation committed.
    MachineConflict:
      description: Stale etag or request ID reused with different command.
    MachineFailure:
      description: Operation failed; transaction rolls back credential, receipt and audit. Retry uncertain outcomes
        with the identical command.
    MachineUnavailable:
      description: Durable credential mutation is not configured.
    MachineMissing:
      description: Account/token not found or optional management handler unavailable.
    Unauthorized:
      description: No valid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller's roles lack the permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
- bearerAuth: []
