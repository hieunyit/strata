language = "C"
include_guard = "STRATA_H"
cpp_compat = true
style = "type"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "doxy"
header = """
/*
 * strata.h — C ABI of libstrata.
 *
 * GENERATED by cbindgen from engine/ffi/src/abi.rs and engine/ffi/src/ffi.rs.
 * Do not edit by hand: run `make header`.
 *
 * Lifetime rules (ABI 1.x):
 *  - every strata_str_t / buffer passed in is borrowed only for the duration
 *    of the call; libstrata copies the little it needs to keep into the
 *    transaction's own bounded storage;
 *  - no UTF-8 or NUL-termination is assumed; ptr may be NULL when len == 0;
 *  - strata_tx_free() and strata_buf_free() accept NULL and are idempotent;
 *    callers set their pointer to NULL right after strata_tx_free();
 *  - no function calls back into the host, and no panic crosses the boundary.
 */"""
after_includes = ""

[export]
include = ["strata_engine_info_t", "strata_header_t", "strata_conn_t", "strata_verdict_t", "strata_err_t", "strata_buf_t"]

[enum]
rename_variants = "None"

[export.rename]
"Engine" = "strata_engine_t"
"Tx" = "strata_tx_t"
