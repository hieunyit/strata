[package]
name = "libstrata-ffi"
version = "0.1.0"
description = "C ABI of the Strata WAF engine (strata.h, libstrata.a)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Produces libstrata.a (linked statically into connectors) and an rlib.
name = "strata"
crate-type = ["staticlib", "rlib"]

[dependencies]
libstrata = { path = ".." }
# pthread_sigmask for the loader thread (src/loader.rs)
libc = "0.2"

[dev-dependencies]
# tests/arena.rs: a full bundle mapped from many threads
strata-compiler = { path = "../compiler" }
strata-hs = { path = "hyperscan" }
serde_json = "1.0.149"

[features]
# Test-only triggers (e.g. a deliberate panic) used by the ABI and NGINX
# integration suites. Never enabled in release packages.
test-hooks = ["libstrata/test-hooks"]

[[test]]
name = "panic_isolation"
required-features = ["test-hooks"]
