[package]
name = "strata-compiler"
version = "0.1.0"
description = "Bundle compiler v0: rule IR (JSON or YAML) + policies -> signed bundle"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "strata-compile"
path = "src/bin/strata-compile.rs"

[dependencies]
libstrata = { path = ".." }
strata-hs = { path = "../ffi/hyperscan", features = ["compile"] }
jsonschema = { version = "=0.56.0", default-features = false }
serde_json = "1.0.149"
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std"] }
yaml-rust2 = "=0.12.0"
