# Fuzz targets (W06-R-01; bodies and body_eval: body parsers). Not part of the workspace: built with sancov
# instrumentation by engine/fuzz/run.sh (stable rustc, libFuzzer from
# libfuzzer-sys), never shipped.
[package]
name = "strata-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
libstrata = { path = "..", features = ["test-hooks"] }

[workspace]

[[bin]]
name = "sqli"
path = "fuzz_targets/sqli.rs"
test = false
doc = false

[[bin]]
name = "xss"
path = "fuzz_targets/xss.rs"
test = false
doc = false

[[bin]]
name = "guard_chunks"
path = "fuzz_targets/guard_chunks.rs"
test = false
doc = false

[[bin]]
name = "response_tx"
path = "fuzz_targets/response_tx.rs"
test = false
doc = false

[[bin]]
name = "bodies"
path = "fuzz_targets/bodies.rs"
test = false
doc = false

[[bin]]
name = "body_eval"
path = "fuzz_targets/body_eval.rs"
test = false
doc = false

[[bin]]
name = "event_encode"
path = "fuzz_targets/event_encode.rs"
test = false
doc = false
