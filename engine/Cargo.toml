[package]
name = "libstrata"
version = "0.1.0"
description = "Strata WAF engine: bundle, transactions, detectors (safe Rust)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
strata-hs = { path = "ffi/hyperscan" }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "fast"] }

[features]
# Test-only triggers (deliberate panic, ...). Never in release packages.
test-hooks = []

[dev-dependencies]
jsonschema = { version = "=0.56.0", default-features = false }
serde_json = "1.0.149"
