# REST routes of strata.admin.v1 for grpc-gateway, kept outside the .proto
# files so that no googleapis dependency is needed.
type: google.api.Service
config_version: 3
http:
  rules:
    - selector: strata.admin.v1.VersionService.GetVersion
      get: /v1/version
    - selector: strata.admin.v1.FleetAdminService.ListGroups
      get: /v1/groups
    - selector: strata.admin.v1.FleetAdminService.CreateGroup
      post: /v1/groups
      body: group
    - selector: strata.admin.v1.FleetAdminService.CreateEnrollmentToken
      post: /v1/groups/{group_id}/enrollmentTokens
      body: "*"
    - selector: strata.admin.v1.FleetAdminService.ListNodes
      get: /v1/nodes
    - selector: strata.admin.v1.FleetAdminService.RevokeNode
      delete: /v1/nodes/{node_id}
    - selector: strata.admin.v1.FleetAdminService.ForceShadow
      post: /v1/nodes:forceShadow
      body: "*"
    - selector: strata.admin.v1.FleetAdminService.ClearForceShadow
      post: /v1/nodes:clearForceShadow
      body: "*"
    - selector: strata.admin.v1.FleetAdminService.CollectDiagnostics
      post: /v1/nodes/{node_id}:collectDiagnostics
      body: "*"
    - selector: strata.admin.v1.FleetAdminService.ListCommands
      get: /v1/commands
    - selector: strata.admin.v1.FleetAdminService.GetCommand
      get: /v1/commands/{command_id}
    - selector: strata.admin.v1.FleetAdminService.EmergencyDisableRule
      post: /v1/rules/{rule_id}:emergencyDisable
      body: "*"
    - selector: strata.admin.v1.FleetAdminService.EnableRule
      post: /v1/rules/{rule_id}:enable
      body: "*"
    - selector: strata.admin.v1.FleetAdminService.ListDisabledRules
      get: /v1/rules:disabled
    - selector: strata.admin.v1.FleetAdminService.SetReplaySampling
      post: /v1/groups/{group_id}:setReplaySampling
      body: "*"
    - selector: strata.admin.v1.FleetAdminService.GetReplaySampling
      get: /v1/groups/{group_id}/replaySampling
    - selector: strata.admin.v1.PolicyService.ListPolicies
      get: /v1/policies
    - selector: strata.admin.v1.PolicyService.GetPolicy
      get: /v1/policies/{policy_id}
    - selector: strata.admin.v1.PolicyService.CreatePolicy
      post: /v1/policies
      body: policy
    - selector: strata.admin.v1.PolicyService.UpdatePolicy
      patch: /v1/policies/{policy.id}
      body: policy
    - selector: strata.admin.v1.PolicyService.ListPolicyVersions
      get: /v1/policies/{policy_id}/versions
    - selector: strata.admin.v1.PolicyService.GetPolicyVersion
      get: /v1/policies/{policy_id}/versions/{version}
    - selector: strata.admin.v1.PolicyService.DeployPolicy
      post: /v1/policies/{policy_id}:deploy
      body: "*"
    - selector: strata.admin.v1.PolicyService.ReplayPolicy
      post: /v1/policies/{policy_id}:replay
      body: "*"
    - selector: strata.admin.v1.PolicyService.GetPolicyVersionReplay
      get: /v1/policies/{policy_id}/versions/{version}/replay
    - selector: strata.admin.v1.OperationService.GetOperation
      get: /v1/operations/{operation_id}
    - selector: strata.admin.v1.RolloutService.ListBundles
      get: /v1/bundles
    - selector: strata.admin.v1.RolloutService.ListRollouts
      get: /v1/rollouts
    - selector: strata.admin.v1.RolloutService.GetRollout
      get: /v1/rollouts/{rollout_id}
    - selector: strata.admin.v1.RolloutService.PauseRollout
      post: /v1/rollouts/{rollout_id}:pause
      body: "*"
    - selector: strata.admin.v1.RolloutService.ResumeRollout
      post: /v1/rollouts/{rollout_id}:resume
      body: "*"
    - selector: strata.admin.v1.RolloutService.AbortRollout
      post: /v1/rollouts/{rollout_id}:abort
      body: "*"
