syntax = "proto3";

package strata.admin.v1;

import "google/protobuf/timestamp.proto";
import "strata/admin/v1/operation.proto";

// PolicyService edits policies and deploys them as signed bundles
// (nginx-module.md › API quản trị: Policy, Phiên bản policy). Every edit is
// a new version; updates carry the etag they were based on, and a stale
// one is refused with ABORTED (HTTP 409). Each new version is replayed
// against the traffic samples on its own (W13-G2-01), and goes through four
// eyes (W13-G2-02): DRAFT, :submit, then :approve or :reject by someone
// else; deploys build each policy's newest approved version.
service PolicyService {
  // REST: GET /v1/policies
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // REST: GET /v1/policyTemplates. The templates a new policy can start
  // from (W20-S-01).
  rpc ListPolicyTemplates(ListPolicyTemplatesRequest) returns (ListPolicyTemplatesResponse);
  // REST: GET /v1/policies/{policy_id}
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  // REST: POST /v1/policies
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  // REST: PATCH /v1/policies/{policy.id}
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  // REST: GET /v1/policies/{policy_id}/versions; policy_id "-" with a state
  // lists that state across policies (the review queue: state=SUBMITTED).
  rpc ListPolicyVersions(ListPolicyVersionsRequest) returns (ListPolicyVersionsResponse);
  // REST: GET /v1/policies/{policy_id}/versions/{version}
  rpc GetPolicyVersion(GetPolicyVersionRequest) returns (GetPolicyVersionResponse);
  // REST: POST /v1/policies/{policy_id}:deploy. Builds a bundle of the
  // newest approved version of every policy, signs it and stores it in
  // object storage. Refused (FAILED_PRECONDITION) while the policy's newest
  // version is not approved.
  rpc DeployPolicy(DeployPolicyRequest) returns (DeployPolicyResponse);
  // REST: POST /v1/policies/{policy_id}:replay. Queues the replay of a
  // version (0: the newest) against the bundle in force, on the policy's
  // traffic samples of the last 7 days and the corpus; follow it with
  // GET /v1/operations/{operation_id}.
  rpc ReplayPolicy(ReplayPolicyRequest) returns (ReplayPolicyResponse);
  // REST: GET /v1/policies/{policy_id}/versions/{version}/replay. The
  // newest replay of the version, done or not; NOT_FOUND when there is none.
  rpc GetPolicyVersionReplay(GetPolicyVersionReplayRequest) returns (GetPolicyVersionReplayResponse);
  // REST: POST /v1/policies/{policy_id}:submit. Puts a DRAFT (or REJECTED)
  // version (0: the newest) up for review.
  rpc SubmitPolicy(SubmitPolicyRequest) returns (SubmitPolicyResponse);
  // REST: POST /v1/policies/{policy_id}:approve. Approves a SUBMITTED
  // version; whoever drafted or submitted it may not (PERMISSION_DENIED).
  rpc ApprovePolicy(ApprovePolicyRequest) returns (ApprovePolicyResponse);
  // REST: POST /v1/policies/{policy_id}:reject. Rejects a SUBMITTED
  // version, with a comment.
  rpc RejectPolicy(RejectPolicyRequest) returns (RejectPolicyResponse);
}

// PolicySpec is what the bundle carries for the policy
// (docs/spec/policies.schema.json).
message PolicySpec {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_SHADOW = 1;
    MODE_ENFORCE = 2;
  }
  Mode mode = 1;
  enum Oversize {
    OVERSIZE_UNSPECIFIED = 0; // pass
    OVERSIZE_PASS = 1;
    OVERSIZE_BLOCK = 2;
  }
  Oversize oversize = 2;
  ResponseLayer response = 3;
  // Longest input snippet of a match in the policy's events, in bytes:
  // 0 or 128 (default), 2048 or 4096 (P-01 §1b). Modules from before the
  // setting refuse bundles with 2048 or 4096: upgrade them first.
  uint32 max_snippet_size = 4;
  // Privacy settings on top of the built-in masks (P-01 §1).
  PrivacySettings privacy = 5;
  // Enforce canary (W12-G2-01): share of clients, in percent (0.01 to 99.99,
  // two decimals), whose requests this enforce policy blocks; the others
  // run in shadow. 0: every client.
  double canary_percent = 6;
  // Arguments inspected, query then body fields (#28): 1 to 1020, rounded up
  // to a multiple of 4; 0 = 1024. A request with more goes by `oversize`
  // (rule 100021). Modules from before the setting refuse bundles that set
  // it: upgrade them first.
  uint32 max_args = 7;
  // #98: when the CPU budget runs out on a request that already has
  // findings (rules matched below the threshold), BLOCK answers as in fail
  // mode closed (503 with the Event ID) whatever the connector's fail mode;
  // PASS (and UNSPECIFIED) follows the fail mode. Enforce only. Modules
  // from before the setting refuse bundles that set BLOCK: upgrade first.
  enum FailOnFindings {
    FAIL_ON_FINDINGS_UNSPECIFIED = 0; // pass
    FAIL_ON_FINDINGS_PASS = 1;
    FAIL_ON_FINDINGS_BLOCK = 2;
  }
  FailOnFindings fail_on_findings = 8;
  // Exact, expiring managed-rule field exclusions; at most 128 per policy.
  // Must follow the normal draft/replay/four-eyes/deploy flow. Old engines
  // refuse the required policy flag: upgrade them before using exceptions.
  repeated PolicyException exceptions = 9;
  // Explicit delegation to reduce listed rules to log-only after FP evidence.
  // Default off; changes require replay and four-eyes approval. Never authorizes
  // automatic re-enforcement. Effective staged rule state is not an API input.
  RuleAutoStaging auto_staging = 10;
  // W17-S-01: CRS paranoia level enforced, 1 to 4; 0 = 1. CRS rules up to
  // it block as usual.
  uint32 crs_paranoia = 11;
  // CRS paranoia level run in shadow, from crs_paranoia to 4; 0 = the
  // enforced level. Rules above the enforced level up to this one are
  // reported (Event ID, action log) but never block or add to the blocking
  // score. Modules from before the setting refuse bundles where either is
  // above 1: upgrade them first. A bundle with PL2 rules is larger (about
  // 29 MB with the signature pack, above Vault transit's request limit).
  uint32 crs_paranoia_shadow = 12;
  // W17-S-01: CRS plugins (rule exclusions for an application) the policy
  // runs, e.g. wordpress, nextcloud: on the application's known paths and
  // fields they take listed CRS rules or targets away. Each must have rules
  // in the deployed rule set (rules/crs-plugins). Modules from before the
  // setting refuse bundles with plugins: upgrade them first.
  repeated string crs_plugins = 13;
  // W19-G2-01: the policy's own rules on the country and ASN of the client
  // address, run for this policy only; at most 16. Send id 0 for a new
  // rule: the control plane assigns a free id (190000-199999, unique across
  // policies). The deploy needs a GeoIP database (City for countries, ASN
  // for ASNs): the bundle carries the networks of the countries and ASNs
  // named. Modules from before the setting refuse bundles with them.
  repeated PolicyGeoRule geo_rules = 14;
  // W20-S-01: the template the policy started from, if any (set when the
  // policy is created from one; kept as it is by later versions).
  PolicyTemplateRef template = 15;
  // Audit 22/10/2026: a body the engine cannot read to its end (rule
  // 100022) or at all (100023, Content-Encoding). BLOCK (and UNSPECIFIED)
  // blocks alone in enforce, whatever oversize says; PASS only records it.
  // Modules from before the setting refuse bundles that set PASS: upgrade
  // them first.
  enum ParseError {
    PARSE_ERROR_UNSPECIFIED = 0; // block
    PARSE_ERROR_BLOCK = 1;
    PARSE_ERROR_PASS = 2;
  }
  ParseError parse_error = 16;
  // RS-3 (docs/plan/rule-sets.md): built-in rule sets (GET /v1/rule-sets)
  // with the policy's action for their rules; a later set wins for a rule
  // in two. At most 32. Modules from before RS-1 refuse bundles where a set
  // or override changes a rule: upgrade them first.
  repeated PolicyRuleSet rule_sets = 17;
  // Actions of single rules, over the rule sets; at most 2048, each with a
  // reason.
  repeated PolicyRuleOverride rule_overrides = 18;
}

// What a policy makes of the rules of a set, or of one rule.
enum PolicyRuleAction {
  // the rule's own behaviour
  POLICY_RULE_ACTION_UNSPECIFIED = 0;
  // the rule does not run for the policy
  POLICY_RULE_ACTION_OFF = 1;
  // reported with an Event ID, never blocks
  POLICY_RULE_ACTION_LOG = 2;
  // a match blocks alone (also a rule that only scores, such as the bot
  // lists, and a rule of the signature pack)
  POLICY_RULE_ACTION_BLOCK = 3;
}

message PolicyRuleSet {
  string set = 1; // e.g. bots-scanners
  PolicyRuleAction action = 2;
}

message PolicyRuleOverride {
  uint32 rule = 1;
  PolicyRuleAction action = 2;
  string reason = 3; // 1 to 256 characters
}

// A geo rule (W19-G2-01): an address in one of the countries or ASNs
// matches; with not, an address outside all of them (local addresses
// excepted). BLOCK blocks the request on the rule alone; LOG reports it
// with an Event ID and never blocks.
message PolicyGeoRule {
  uint32 id = 1;
  repeated string countries = 2; // ISO 3166-1 alpha-2, e.g. VN
  repeated uint32 asns = 3;
  bool not = 4;
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_BLOCK = 1;
    ACTION_LOG = 2;
  }
  Action action = 5;
}

// Control-plane authorization metadata; not runtime policy parameters.
message RuleAutoStaging {
  bool enabled = 1;
  // 1–16 distinct existing managed Rule IDs; compiler/runtime verify membership.
  repeated uint32 rule_ids = 2;
  // Decision and initial report windows in seconds, 60–86400.
  uint32 window_seconds = 3;
  // Minimum matched security events, 1–1000000000.
  uint32 min_matches = 4;
  // Initial unambiguous FP reports, 1–min_matches; exact deployed bundle.
  uint32 min_reports = 5;
  // FP report share over matched security events, basis points, 1–10000.
  uint32 fp_threshold_bps = 6;
}

message PolicyException {
  // exc- followed by 32 lowercase hex digits, unique within a policy.
  string id = 1;
  uint32 rule_id = 2;
  string method = 3;
  string host = 4;
  string path = 5;
  // ARGS:<case-sensitive name> or REQUEST_HEADERS:<ASCII token>.
  string field = 6;
  // Absolute expiry in Unix milliseconds, mandatory and positive.
  int64 expires_unix_ms = 7;
  string reason = 8;
  string source_block_id = 9;
}

message PrivacySettings {
  // Field names whose input is never kept in events (parameters, headers,
  // the last part of a JSON path), case-insensitive; at most 64.
  repeated string sensitive_fields = 1;
  // Patterns masked with '*' in event snippets and headers (linear-time
  // regex, not matching the empty string); at most 16, 256 bytes each.
  repeated string mask_patterns = 2;
  // plain (default) or hmac: events carry hmac: and 32 hex digits of
  // HMAC-SHA256 with the installation's identity key instead of the
  // identity (STRATA_IDENTITY_HMAC_KEY, or a key the control plane keeps).
  string identity = 3;
}

message ResponseLayer {
  bool allowed_codes_check = 1;
  bool db_errors = 2;
  // cccd, jwt, pan
  repeated string data_guard = 3;
}

message Policy {
  // [a-z0-9][a-z0-9-]{0,62}; set at creation.
  string id = 1;
  // Name in the bundle and in strata_policy: [a-z0-9._-]{1,55}.
  string name = 2;
  PolicySpec spec = 3;
  uint32 version = 4;
  string etag = 5;
  string created_by = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
  // the newest approved (or deployed) version, which a deploy builds, and
  // the newest deployed one; 0: none
  uint32 approved_version = 9;
  uint32 deployed_version = 10;
}

message PolicyVersion {
  string policy_id = 1;
  uint32 version = 2;
  PolicySpec spec = 3;
  // DRAFT, SUBMITTED, APPROVED, REJECTED or DEPLOYED
  string state = 4;
  string created_by = 5;
  google.protobuf.Timestamp create_time = 6;
  string submitted_by = 7;
  google.protobuf.Timestamp submit_time = 8;
  // who approved or rejected it, when, and why
  string decided_by = 9;
  google.protobuf.Timestamp decide_time = 10;
  string decision_comment = 11;
  // Completed replay bound by the approval, not a later unapproved replay.
  string approved_replay_id = 12;
}

message Bundle {
  uint64 version = 1;
  string sha256 = 2; // hex
  string object_key = 3;
  uint64 size_bytes = 4;
  // policy id -> version built into the bundle
  map<string, uint32> contents = 5;
  string created_by = 6;
  google.protobuf.Timestamp create_time = 7;
  string input_digest = 8;
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message GetPolicyRequest {
  string policy_id = 1;
}

message GetPolicyResponse {
  Policy policy = 1;
}

message CreatePolicyRequest {
  Policy policy = 1; // id, name, spec
  // W20-S-01: start from this template (ListPolicyTemplates): its spec,
  // with the fields policy.spec sets on top. The policy records the
  // template's name and version, then is on its own: a later template
  // change does not reach it.
  string template = 2;
}

message ListPolicyTemplatesRequest {}

message PolicyTemplate {
  string name = 1;
  int32 version = 2;
  string description = 3;
  PolicySpec spec = 4;
}

message ListPolicyTemplatesResponse {
  repeated PolicyTemplate templates = 1;
}

// The template a policy started from (W20-S-01); informative.
message PolicyTemplateRef {
  string name = 1;
  int32 version = 2;
}

message CreatePolicyResponse {
  Policy policy = 1;
  // The replay of the new version queued on its own; empty when replay is
  // not configured on this control plane.
  string replay_operation = 2;
}

message UpdatePolicyRequest {
  Policy policy = 1; // id, spec, and the etag it was read with
}

message UpdatePolicyResponse {
  Policy policy = 1;
  // As in CreatePolicyResponse.
  string replay_operation = 2;
}

message ListPolicyVersionsRequest {
  string policy_id = 1; // "-": every policy (state is then required)
  string state = 2;     // only versions in this state; "": all
}

message ListPolicyVersionsResponse {
  repeated PolicyVersion versions = 1;
}

message GetPolicyVersionRequest {
  string policy_id = 1;
  uint32 version = 2;
}

message GetPolicyVersionResponse {
  PolicyVersion version = 1;
}

message DeployPolicyRequest {
  string policy_id = 1;
}

message DeployPolicyResponse {
  Bundle bundle = 1;
  // The rollout of the bundle to the nodes (GET /v1/rollouts/{id}); 0 when
  // this control plane does not distribute bundles.
  int64 rollout_id = 2;
}

message ReplayPolicyRequest {
  string policy_id = 1;
  uint32 version = 2; // 0: the newest
}

message GetPolicyVersionReplayRequest {
  string policy_id = 1;
  uint32 version = 2;
}

message ReplayPolicyResponse {
  Operation operation = 1;
}

message GetPolicyVersionReplayResponse {
  Operation operation = 1;
}

message SubmitPolicyRequest {
  string policy_id = 1;
  uint32 version = 2; // 0: the newest
}

message SubmitPolicyResponse {
  PolicyVersion version = 1;
}

message ApprovePolicyRequest {
  string policy_id = 1;
  uint32 version = 2; // required
  string comment = 3; // optional, at most 1000 characters
  // Optional: the DONE replay report the reviewer inspected. A stale ID is
  // rejected atomically with the decision; omitted retains legacy behavior.
  string expected_replay_id = 4;
}

message ApprovePolicyResponse {
  PolicyVersion version = 1;
}

message RejectPolicyRequest {
  string policy_id = 1;
  uint32 version = 2; // required
  string comment = 3; // required, 1 to 1000 characters
}

message RejectPolicyResponse {
  PolicyVersion version = 1;
}
