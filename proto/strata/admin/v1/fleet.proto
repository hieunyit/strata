syntax = "proto3";

package strata.admin.v1;

import "google/protobuf/timestamp.proto";

// FleetAdminService manages connector groups, enrollment tokens and nodes
// (nginx-module.md › API quản trị: Connector group, node). Writes need
// nodes:write and are audited; reads need nodes:read.
service FleetAdminService {
  // REST: GET /v1/groups
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // REST: POST /v1/groups
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  // REST: POST /v1/groups/{group_id}/enrollmentTokens
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  // REST: GET /v1/nodes
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // REST: DELETE /v1/nodes/{node_id}. The node's streams are cut and its
  // certificates refused from then on.
  rpc RevokeNode(RevokeNodeRequest) returns (RevokeNodeResponse);
  // REST: POST /v1/nodes:forceShadow. Emergency shadow mode for one policy
  // (or every policy) on one node or every node of a group, for a while
  // (nginx-module.md › Fallback). Needs policies:deploy; audited. Nodes
  // apply it within seconds while connected; a node that connects later
  // gets it if the duration has not run out.
  rpc ForceShadow(ForceShadowRequest) returns (ForceShadowResponse);
  // REST: POST /v1/nodes:clearForceShadow. Ends a force shadow before its
  // deadline: of policy_id, or every one of the nodes when it is empty
  // Same permission and audit.
  rpc ClearForceShadow(ClearForceShadowRequest) returns (ClearForceShadowResponse);
  // REST: POST /v1/nodes/{node_id}:collectDiagnostics. The agent answers
  // with non-sensitive facts (versions, bundle, counters). Needs nodes:write.
  rpc CollectDiagnostics(CollectDiagnosticsRequest) returns (CollectDiagnosticsResponse);
  // REST: GET /v1/commands?node_id=. Newest first, at most 100.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  // REST: GET /v1/commands/{command_id}
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse);
  // REST: POST /v1/rules/{rule_id}:emergencyDisable. Emergency kill switch
  // (W12-G2-02): the rule stops matching, in every policy, on every node of
  // the group within seconds, without a deploy. It stays off (also for
  // nodes that connect later) until EnableRule. A reason is required;
  // operator and above (rules:disable); audited with the reason.
  rpc EmergencyDisableRule(EmergencyDisableRuleRequest) returns (EmergencyDisableRuleResponse);
  // REST: POST /v1/rules/{rule_id}:enable. Switches the rule back on in
  // the group. Same permission, reason and audit.
  rpc EnableRule(EnableRuleRequest) returns (EnableRuleResponse);
  // REST: GET /v1/rules:disabled?group_id=. The rules switched off, of one
  // group or of every group. Needs nodes:read.
  rpc ListDisabledRules(ListDisabledRulesRequest) returns (ListDisabledRulesResponse);
  // REST: POST /v1/groups/{group_id}:setReplaySampling. The share of
  // requests the group's nodes sample for replay, anonymized with the
  // group's key (W12-N-01); a new key when the group has none or
  // rotate_key is set. Above 0 only once the control plane runs with
  // -replay-sampling-approved (legal review of the sample format). Needs
  // replay:configure (admin).
  rpc SetReplaySampling(SetReplaySamplingRequest) returns (SetReplaySamplingResponse);
  // REST: GET /v1/groups/{group_id}/replaySampling. Needs nodes:read; never
  // the key.
  rpc GetReplaySampling(GetReplaySamplingRequest) returns (GetReplaySamplingResponse);
}

message ReplaySampling {
  string group_id = 1;
  double rate_percent = 2; // 0 (off) to 100, two decimals
  string key_id = 3;
  string updated_by = 4;
  google.protobuf.Timestamp update_time = 5;
}

message SetReplaySamplingRequest {
  string group_id = 1;
  double rate_percent = 2;
  bool rotate_key = 3;
}

message SetReplaySamplingResponse {
  ReplaySampling sampling = 1;
  repeated NodeCommand commands = 2;
}

message GetReplaySamplingRequest {
  string group_id = 1;
}

message GetReplaySamplingResponse {
  ReplaySampling sampling = 1;
}

message Group {
  string id = 1; // [a-z0-9][a-z0-9-]{0,62}
  string name = 2;
  google.protobuf.Timestamp create_time = 3;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  Group group = 1; // id and name
}

message CreateGroupResponse {
  Group group = 1;
}

message CreateEnrollmentTokenRequest {
  string group_id = 1;
  // At most and by default 86400 (24 hours).
  uint32 ttl_seconds = 2;
}

message CreateEnrollmentTokenResponse {
  string id = 1;
  string group_id = 2;
  // Shown once; only its SHA-256 is stored. Single use.
  string token = 3;
  google.protobuf.Timestamp expire_time = 4;
}

message Node {
  string id = 1;
  string group_id = 2;
  string hostname = 3;
  string proxy_version = 4;
  string module_version = 5;
  uint64 bundle_version = 6;
  string bundle_state = 7; // NONE, VERIFIED, ACTIVE, FAILED
  // A stream is open, or a heartbeat came within the last 30 seconds.
  bool online = 8;
  google.protobuf.Timestamp last_seen_time = 9;
  google.protobuf.Timestamp cert_expire_time = 10;
  bool revoked = 11;
  google.protobuf.Timestamp create_time = 12;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message RevokeNodeRequest {
  string node_id = 1;
}

message RevokeNodeResponse {
  Node node = 1;
}

// NodeCommand is a command sent to one node and its result.
message NodeCommand {
  string id = 1;
  string node_id = 2;
  // FORCE_SHADOW, CLEAR_FORCE_SHADOW, DIAGNOSTICS, DISABLE_RULES,
  // SET_DISABLED_RULES, ENABLE_RULES
  string kind = 3;
  string policy_id = 4; // FORCE_SHADOW: empty = every policy
  uint32 duration_seconds = 5; // FORCE_SHADOW
  // PENDING (not sent yet), SENT, DONE, FAILED (the agent refused or
  // failed), EXPIRED (not answered before its deadline)
  string state = 6;
  string error = 7;
  string output = 8; // DIAGNOSTICS: JSON from the agent (untrusted)
  string created_by = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp expire_time = 11;
  google.protobuf.Timestamp update_time = 12;
  repeated uint32 rule_ids = 13; // DISABLE_RULES, ENABLE_RULES
}

message EmergencyDisableRuleRequest {
  uint32 rule_id = 1;
  string group_id = 2;
  string reason = 3; // 1..500 characters, required
}

message EmergencyDisableRuleResponse {
  DisabledRule rule = 1;
  repeated NodeCommand commands = 2; // one per node of the group
}

message EnableRuleRequest {
  uint32 rule_id = 1;
  string group_id = 2;
  string reason = 3; // 1..500 characters, required
}

message EnableRuleResponse {
  repeated NodeCommand commands = 1;
}

message ListDisabledRulesRequest {
  string group_id = 1; // empty: every group
}

message ListDisabledRulesResponse {
  repeated DisabledRule rules = 1;
}

message DisabledRule {
  string group_id = 1;
  uint32 rule_id = 2;
  string reason = 3;
  string created_by = 4;
  google.protobuf.Timestamp create_time = 5;
}

message ForceShadowRequest {
  // Exactly one of node_id and group_id.
  string node_id = 1;
  string group_id = 2;
  string policy_id = 3; // empty: every policy
  uint32 duration_seconds = 4; // 1..86400
}

message ForceShadowResponse {
  repeated NodeCommand commands = 1; // one per node (revoked nodes skipped)
}

message ClearForceShadowRequest {
  // Exactly one of node_id and group_id.
  string node_id = 1;
  string group_id = 2;
  string policy_id = 3; // empty: every force shadow of the nodes
}

message ClearForceShadowResponse {
  repeated NodeCommand commands = 1;
}

message CollectDiagnosticsRequest {
  string node_id = 1;
}

message CollectDiagnosticsResponse {
  NodeCommand command = 1;
}

message ListCommandsRequest {
  string node_id = 1; // empty: every node
}

message ListCommandsResponse {
  repeated NodeCommand commands = 1;
}

message GetCommandRequest {
  string command_id = 1;
}

message GetCommandResponse {
  NodeCommand command = 1;
}
