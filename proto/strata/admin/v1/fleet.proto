syntax = "proto3";

package strata.admin.v1;

import "google/protobuf/timestamp.proto";

// FleetAdminService manages connector groups, enrollment tokens and nodes
// (nginx-module.md › API quản trị: Connector group, node). Writes need
// nodes:write and are audited; reads need nodes:read.
service FleetAdminService {
  // REST: GET /v1/groups
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // REST: POST /v1/groups
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  // REST: POST /v1/groups/{group_id}/enrollmentTokens
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  // REST: GET /v1/nodes
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // REST: DELETE /v1/nodes/{node_id}. The node's streams are cut and its
  // certificates refused from then on.
  rpc RevokeNode(RevokeNodeRequest) returns (RevokeNodeResponse);
  // REST: POST /v1/nodes:forceShadow. Emergency shadow mode for one policy
  // (or every policy) on one node or every node of a group, for a while
  // (nginx-module.md › Fallback). Needs policies:deploy; audited. Nodes
  // apply it within seconds while connected; a node that connects later
  // gets it if the duration has not run out.
  rpc ForceShadow(ForceShadowRequest) returns (ForceShadowResponse);
  // REST: POST /v1/nodes/{node_id}:collectDiagnostics. The agent answers
  // with non-sensitive facts (versions, bundle, counters). Needs nodes:write.
  rpc CollectDiagnostics(CollectDiagnosticsRequest) returns (CollectDiagnosticsResponse);
  // REST: GET /v1/commands?node_id=. Newest first, at most 100.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  // REST: GET /v1/commands/{command_id}
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse);
}

message Group {
  string id = 1; // [a-z0-9][a-z0-9-]{0,62}
  string name = 2;
  google.protobuf.Timestamp create_time = 3;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  Group group = 1; // id and name
}

message CreateGroupResponse {
  Group group = 1;
}

message CreateEnrollmentTokenRequest {
  string group_id = 1;
  // At most and by default 86400 (24 hours).
  uint32 ttl_seconds = 2;
}

message CreateEnrollmentTokenResponse {
  string id = 1;
  string group_id = 2;
  // Shown once; only its SHA-256 is stored. Single use.
  string token = 3;
  google.protobuf.Timestamp expire_time = 4;
}

message Node {
  string id = 1;
  string group_id = 2;
  string hostname = 3;
  string proxy_version = 4;
  string module_version = 5;
  uint64 bundle_version = 6;
  string bundle_state = 7; // NONE, VERIFIED, ACTIVE, FAILED
  // A stream is open, or a heartbeat came within the last 30 seconds.
  bool online = 8;
  google.protobuf.Timestamp last_seen_time = 9;
  google.protobuf.Timestamp cert_expire_time = 10;
  bool revoked = 11;
  google.protobuf.Timestamp create_time = 12;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message RevokeNodeRequest {
  string node_id = 1;
}

message RevokeNodeResponse {
  Node node = 1;
}

// NodeCommand is a command sent to one node and its result.
message NodeCommand {
  string id = 1;
  string node_id = 2;
  string kind = 3; // FORCE_SHADOW, DIAGNOSTICS
  string policy_id = 4; // FORCE_SHADOW: empty = every policy
  uint32 duration_seconds = 5; // FORCE_SHADOW
  // PENDING (not sent yet), SENT, DONE, FAILED (the agent refused or
  // failed), EXPIRED (not answered before its deadline)
  string state = 6;
  string error = 7;
  string output = 8; // DIAGNOSTICS: JSON from the agent (untrusted)
  string created_by = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp expire_time = 11;
  google.protobuf.Timestamp update_time = 12;
}

message ForceShadowRequest {
  // Exactly one of node_id and group_id.
  string node_id = 1;
  string group_id = 2;
  string policy_id = 3; // empty: every policy
  uint32 duration_seconds = 4; // 1..86400
}

message ForceShadowResponse {
  repeated NodeCommand commands = 1; // one per node (revoked nodes skipped)
}

message CollectDiagnosticsRequest {
  string node_id = 1;
}

message CollectDiagnosticsResponse {
  NodeCommand command = 1;
}

message ListCommandsRequest {
  string node_id = 1; // empty: every node
}

message ListCommandsResponse {
  repeated NodeCommand commands = 1;
}

message GetCommandRequest {
  string command_id = 1;
}

message GetCommandResponse {
  NodeCommand command = 1;
}
