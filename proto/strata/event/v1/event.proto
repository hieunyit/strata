syntax = "proto3";

package strata.event.v1;

// One security event. The worker sends one Event per datagram on
// strata_event_socket (at most 8 KB); strata-agent batches the same
// message into strata.fleet.v1.EventBatch. See nginx-module.md ›
// "Trang chặn, Block ID & sự kiện".
message Event {
  // STR-XXXX-XXXX-XXXX-XXXX, or EVT-... for shadow and error events.
  string block_id = 1;
  // Time the decision was made, Unix milliseconds.
  uint64 time_unix_ms = 2;
  // strata_node_id of the worker; the agent overwrites it with the
  // enrolled node id before sending upstream.
  string node_id = 3;
  // $request_id when NGINX has it.
  string request_id = 4;
  string policy_id = 5;
  uint64 bundle_version = 6;
  string client_ip = 7;
  string identity = 8;
  string method = 9;
  string host = 10;
  string path = 11;
  uint32 status = 12;
  Action action = 13;
  // Score per layer, keyed by layer name (protocol, sqli, xss, anomaly...).
  map<string, int32> layer_scores = 14;
  repeated uint32 rule_ids = 15;
  repeated Match matches = 16;
  // RV-G2-01 (P-01 §1): context for the investigation. User-Agent and
  // Referer, at most 512 bytes each, sensitive query values of the Referer
  // masked; the other request headers, at most 32 and 2 KB in all, values
  // of sensitive headers (Authorization, Cookie, X-Api-Key...) replaced by
  // [MASKED], the others masked like snippets (CCCD, JWT, card numbers).
  // Empty when the module did not keep them (see nginx-module.md).
  string user_agent = 17;
  string referer = 18;
  repeated Header headers = 19;
  // RV-N-01: how much of the request the engine inspected.
  Inspection inspection = 20;
  // #57: the request is blocked, or would be in shadow (score at the
  // threshold or a block_alone rule). False for findings below the
  // threshold and for engine errors.
  bool would_block = 21;
  // Side of the policy's enforce canary the client fell on (W12-G2-01).
  CanaryGroup canary = 22;
  // W13-R-02: in the event of a sampled transaction (1% by default), its
  // most expensive rules, at most 8, most expensive first; rule_id 0 is the
  // prefilter's scans, shared by every rule. Empty when not sampled.
  repeated RuleCost rule_costs = 23;
}

message Header {
  string name = 1;
  bytes value = 2;
}

enum Inspection {
  // events of modules before the field
  INSPECTION_UNSPECIFIED = 0;
  INSPECTION_FULL = 1;
  // the CPU budget ran out: not every rule was evaluated (fail mode)
  INSPECTION_PARTIAL = 2;
  // the body, or part of it, was not inspected (over the limit, spooled)
  INSPECTION_BODY_SKIPPED = 3;
}

// Canary group of a request: whether its policy has an enforce canary
// (canary_percent) and whether the client is inside it.
enum CanaryGroup {
  // The policy has no canary (or the event predates W12-G2-01).
  CANARY_GROUP_UNSPECIFIED = 0;
  // Inside the canary: the policy is enforced.
  CANARY_GROUP_ENFORCE = 1;
  // Outside the canary: the policy runs in shadow.
  CANARY_GROUP_SHADOW = 2;
}

// Mirrors STRATA_ACTION_* in strata.h, shifted by one so that 0 stays
// "unspecified".
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_ALLOW = 1;
  ACTION_LOG = 2;
  ACTION_CHALLENGE = 3;
  ACTION_BLOCK = 4;
}

message Match {
  uint32 rule_id = 1;
  string layer = 2;
  // Where the input came from, e.g. ARGS:id or REQUEST_BODY.
  string field = 3;
  // Normalized input with sensitive data masked: 128 bytes, or what the
  // policy's max_snippet_size allows (2 or 4 KB).
  bytes snippet = 4;
}

// A replay sample (W12-N-01): one request of a sampled transaction, already
// anonymized at the connector with the connector group's key
// (docs/spec/replay-sample.md). On the event socket it follows the 4 bytes
// "\xffSR1", so the agent tells it from an Event. Fields 3..16 are the
// columns of the sample file.
message ReplaySample {
  string anon_key_id = 1;
  uint64 ts_ms = 2;
  bytes node_id = 3;
  bytes policy = 4;
  bytes method = 5;
  bytes raw_uri = 6;
  bytes uri = 7;
  bytes args = 8;
  bytes proto = 9;
  bytes client = 10;
  bytes headers = 11; // JSON [[name, value], ...]
  bytes body = 12;
  uint64 body_len = 13;
  bool body_truncated = 14;
  bytes action = 15;
  bytes rules = 16;
  CanaryGroup canary = 17;
  uint64 bundle_version = 18;
}

// Requests per policy of one NGINX worker since its last such datagram
// (RV-N-01, engine/src/counters.rs): the denominator of the share of
// requests not fully inspected. On the event socket it follows the 4 bytes
// "\xffSC1"; about one per second per worker while it serves requests.
message PolicyCounters {
  uint64 time_unix_ms = 1;
  string node_id = 2;
  uint64 bundle_version = 3;
  repeated PolicyCount policies = 4;
  // W13-R-02: engine time by rule over the transactions sampled since the
  // last counters (1% by default), most expensive first; rule_id 0 is the
  // prefilter's scans. At most 64 rules a datagram: the others go next time.
  repeated RuleCost rule_costs = 5;
  uint64 sampled_requests = 6;
  // engine time of the sampled transactions, all of it (the share of each
  // rule is its total_ns over this)
  uint64 sampled_engine_ns = 7;
}

// Samples of one rule's evaluation time (W13-R-02).
message RuleCost {
  uint32 rule_id = 1;  // 0: the prefilter's scans
  uint64 samples = 2;  // times the rule was evaluated in sampled transactions
  uint64 total_ns = 3;
  uint64 max_ns = 4;
}

message PolicyCount {
  // strata_policy of the location; empty: a name the bundle does not have
  string policy = 1;
  uint64 requests = 2;
  // of requests: not fully inspected, by why (fail mode decided)
  uint64 partial = 3;      // the CPU budget ran out
  uint64 body_skipped = 4; // the body, or part of it, was not inspected
  uint64 error = 5;        // another engine error
  // of requests: run degraded by the worker's circuit breaker (W11-N-01)
  uint64 degraded = 6;
}
