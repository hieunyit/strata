# deploy/redteam/nginx/nginx.conf
# NGINX Configuration for Adversarial Assessment (docs/plan/redteam-plan.md § 2.3)
load_module /usr/lib/nginx/modules/ngx_http_strata_module.so;

daemon off;
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log /tmp/nginx/logs/error.log notice;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format redteam '$remote_addr "$request" $status port=$server_port '
                       'blk=$strata_block_id act=$strata_action score=$strata_score '
                       'rules=$strata_rules policy=$strata_policy t=$strata_time_us';
    access_log /tmp/nginx/logs/access.log redteam;
    access_log /dev/stdout redteam;

    strata_control_file  /var/lib/strata/bundles/control;
    strata_bundle_dir    /var/lib/strata/bundles;
    strata_bundle_pubkey /var/lib/strata/bundles/bundle.pub;
    strata_node_id       redteam-node-1;
    strata_event_socket  unix:/run/strata/events.sock;
    strata_metrics_file  /run/strata/metrics;

    upstream backend_permissive {
        server backend-permissive:8001;
        keepalive 32;
    }

    upstream backend_strict {
        server backend-strict:8002;
        keepalive 32;
    }

    # =========================================================================
    # Profile A: Standard Default (Port 8080)
    # - budget 10ms, fail_mode open, oversize pass
    # =========================================================================
    server {
        listen 8080 default_server;
        server_name _;

        location / {
            strata on;
            strata_policy example-api;
            strata_cpu_budget 10ms;
            strata_fail_mode open;

            proxy_pass http://backend_permissive;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /strict/ {
            strata on;
            strata_policy example-api;
            strata_cpu_budget 10ms;
            strata_fail_mode open;

            proxy_pass http://backend_strict/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /healthz {
            strata off;
            return 200 "ok-profile-a\n";
        }
    }

    # =========================================================================
    # Profile B: Hardened Strict (Port 8081)
    # - budget 10ms, fail_mode closed
    # =========================================================================
    server {
        listen 8081;
        server_name _;

        location / {
            strata on;
            strata_policy example-api;
            strata_cpu_budget 10ms;
            strata_fail_mode closed;

            proxy_pass http://backend_permissive;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /strict/ {
            strata on;
            strata_policy example-api;
            strata_cpu_budget 10ms;
            strata_fail_mode closed;

            proxy_pass http://backend_strict/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /healthz {
            strata off;
            return 200 "ok-profile-b\n";
        }
    }

    # =========================================================================
    # Profile C: Stress / Low Budget (Port 8082)
    # - budget 2ms, fail_mode open
    # =========================================================================
    server {
        listen 8082;
        server_name _;

        location / {
            strata on;
            strata_policy example-api;
            strata_cpu_budget 2ms;
            strata_fail_mode open;

            proxy_pass http://backend_permissive;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /strict/ {
            strata on;
            strata_policy example-api;
            strata_cpu_budget 2ms;
            strata_fail_mode open;

            proxy_pass http://backend_strict/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /healthz {
            strata off;
            return 200 "ok-profile-c\n";
        }
    }
}
