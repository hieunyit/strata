# Lab NGINX node. @VERSION@ and @NODE@ are filled in by the container
# command (compose.yaml).
load_module /opt/nginx/@VERSION@/ngx_http_strata_module.so;

daemon off;
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include /opt/nginx/@VERSION@/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format strata '$remote_addr "$request" $status node=@NODE@ blk=$strata_block_id '
                      'act=$strata_action score=$strata_score rules=$strata_rules '
                      'policy=$strata_policy bundle=$strata_bundle_version t=$strata_time_us';
    access_log /dev/stdout strata;

    strata_control_file  /var/lib/strata/bundles/control;
    strata_bundle_dir    /var/lib/strata/bundles;
    strata_bundle_pubkey /var/lib/strata/bundles/bundle.pub;
    strata_node_id       @NODE@;
    strata_event_socket  unix:/run/strata/events.sock;
    strata_metrics_file  /run/strata/metrics;

    server {
        listen 8080;
        server_name api.example.test;

        location / {
            strata on;
            strata_policy example-api;
            proxy_pass http://127.0.0.1:8081;
        }

        location /web/ {
            strata on;
            strata_policy example-web;
            proxy_pass http://127.0.0.1:8081;
        }

        location = /healthz {
            strata off;
            return 200 "ok\n";
        }
    }

    # Stand-in for the protected application.
    server {
        listen 127.0.0.1:8081;
        location / {
            return 200 "backend @NODE@ uri=$request_uri\n";
        }
    }
}
