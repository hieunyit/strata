# Strata lab (W03-Q-01). Start with `make lab-up`; see deploy/lab/README.md.
# Host ports are bound to 127.0.0.1 only. Passwords come from
# deploy/lab/.state/env, generated by init-env.sh and never committed.
name: strata-lab

x-runtime: &runtime
  image: strata-lab-runtime:dev
  restart: unless-stopped

x-nginx: &nginx
  <<: *runtime
  read_only: true
  tmpfs: [/tmp]
  command:
    - sh
    - -ec
    - |
      mkdir -p /tmp/nginx/logs
      sed -e "s/@VERSION@/$$NGINX_VERSION/g" -e "s/@NODE@/$$NODE_ID/g" /etc/strata/nginx.conf.in > /tmp/nginx/nginx.conf
      exec /opt/nginx/$$NGINX_VERSION/nginx -p /tmp/nginx -c /tmp/nginx/nginx.conf
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
    interval: 5s
    retries: 20

x-agent: &agent
  <<: *runtime
  read_only: true
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9469/metrics", "-o", "/dev/null"]
    interval: 5s
    retries: 20

services:
  lab-init:
    image: strata-lab-runtime:dev
    build: { context: ../../build/lab/dist }
    user: root
    command: ["/opt/strata/init.sh"]
    volumes:
      - state:/state
      - bundles:/bundles

  nginx-stable:
    <<: *nginx
    environment: { NGINX_VERSION: "1.30.5", NODE_ID: node-1 }
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/strata/nginx.conf.in:ro
      - bundles:/var/lib/strata/bundles:ro
      - run-node-1:/run/strata
      - shm-node-1:/dev/shm/strata
    depends_on:
      lab-init: { condition: service_completed_successfully }
      agent-1: { condition: service_started }

  nginx-mainline:
    <<: *nginx
    environment: { NGINX_VERSION: "1.31.6", NODE_ID: node-2 }
    ports: ["127.0.0.1:18081:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/strata/nginx.conf.in:ro
      - bundles:/var/lib/strata/bundles:ro
      - run-node-2:/run/strata
      - shm-node-2:/dev/shm/strata
    depends_on:
      lab-init: { condition: service_completed_successfully }
      agent-2: { condition: service_started }

  agent-1:
    <<: *agent
    command:
      - strata-agent
      - run
      - --event-socket=unix:/run/strata/events.sock
      - --spool-dir=/var/lib/strata/spool
      - --server=control-plane:8443
      - --server-name=cp.example.test
      - --tls-ca=/state/pki/ca.pem
      - --tls-cert=/state/pki/node-1.pem
      - --tls-key=/state/pki/node-1-key.pem
      - --node-id=node-1
      - --metrics-file=/dev/shm/strata/metrics
      - --metrics-addr=0.0.0.0:9469
    volumes:
      - state:/state:ro
      - run-node-1:/run/strata
      - shm-node-1:/dev/shm/strata
      - spool-node-1:/var/lib/strata/spool
    depends_on:
      lab-init: { condition: service_completed_successfully }

  agent-2:
    <<: *agent
    command:
      - strata-agent
      - run
      - --event-socket=unix:/run/strata/events.sock
      - --spool-dir=/var/lib/strata/spool
      - --server=control-plane:8443
      - --server-name=cp.example.test
      - --tls-ca=/state/pki/ca.pem
      - --tls-cert=/state/pki/node-2.pem
      - --tls-key=/state/pki/node-2-key.pem
      - --node-id=node-2
      - --metrics-file=/dev/shm/strata/metrics
      - --metrics-addr=0.0.0.0:9469
    volumes:
      - state:/state:ro
      - run-node-2:/run/strata
      - shm-node-2:/dev/shm/strata
      - spool-node-2:/var/lib/strata/spool
    depends_on:
      lab-init: { condition: service_completed_successfully }

  control-plane:
    <<: *runtime
    read_only: true
    command:
      - strata-control-plane
      - -addr=:8080
      - -in-memory=false
      - -seed=false
      - -clickhouse-addr=clickhouse:9000
      - -clickhouse-user=strata
      - -grpc-addr=:8443
      - -tls-ca=/state/pki/ca.pem
      - -tls-cert=/state/pki/cp.pem
      - -tls-key=/state/pki/cp-key.pem
      # Tokens name the issuer the browser sees; the control plane reads the
      # metadata inside the compose network.
      - -oidc-issuer=http://127.0.0.1:18180/realms/strata
      - -oidc-discovery-url=http://keycloak:8080/realms/strata
      - -oidc-audience=strata-api
      - -admin-grpc-addr=:9090
      - -admin-grpc-plaintext
    environment:
      STRATA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run deploy/lab/init-env.sh}
      STRATA_POSTGRES_DSN: postgres://strata:${POSTGRES_PASSWORD}@postgres:5432/strata?sslmode=disable
    ports: ["127.0.0.1:18090:8080", "127.0.0.1:18091:9090"]
    volumes:
      - state:/state:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      retries: 30
    depends_on:
      lab-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: strata
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run deploy/lab/init-env.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    ports: ["127.0.0.1:18123:8123"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ../../control-plane/ingest/schema.sql:/docker-entrypoint-initdb.d/10-events.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "strata", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "EXISTS TABLE default.events"]
      interval: 5s
      retries: 30

  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/lab/init-env.sh}
      POSTGRES_DB: strata
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "strata", "-d", "strata"]
      interval: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: strata
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run deploy/lab/init-env.sh}
      # One issuer for browser and scripts (127.0.0.1:18180); backchannel
      # calls from containers (JWKS, token) use the name they came in on.
      KC_HOSTNAME: http://127.0.0.1:18180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Substituted into strata-realm.json on import.
      LAB_CLI_SECRET: ${LAB_CLI_SECRET:?run make lab-clean, then make lab-up}
      LAB_VIEWER_PASSWORD: ${LAB_VIEWER_PASSWORD}
      LAB_OPERATOR_PASSWORD: ${LAB_OPERATOR_PASSWORD}
      LAB_APPROVER_PASSWORD: ${LAB_APPROVER_PASSWORD}
      LAB_ADMIN_PASSWORD: ${LAB_ADMIN_PASSWORD}
    ports: ["127.0.0.1:18180:8080"]
    volumes:
      - ./keycloak/strata-realm.json:/opt/keycloak/data/import/strata-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }

  # MinIO no longer publishes community images; Chainguard's build is
  # pinned by digest.
  minio:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: strata
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run deploy/lab/init-env.sh}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes:
      - minio:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:d1b0ec88e3ac5233e2862594c06399095337fa816c0960f78081ba4965bdc0c5
    restart: on-failure
    command: ["mb", "--ignore-existing", "lab/strata-bundles"]
    environment:
      MC_HOST_lab: http://strata:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      minio: { condition: service_started }

  ui:
    build:
      context: ../..
      dockerfile: deploy/lab/ui.Dockerfile
    image: strata-lab-ui:dev
    restart: unless-stopped
    ports: ["127.0.0.1:18088:80"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/", "-o", "/dev/null"]
      interval: 5s
      retries: 20
    depends_on:
      control-plane: { condition: service_started }

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    restart: unless-stopped
    command: ["-promscrape.config=/etc/vm/scrape.yml", "-retentionPeriod=14d", "-storageDataPath=/storage"]
    ports: ["127.0.0.1:18428:8428"]
    volumes:
      - ./vm/scrape.yml:/etc/vm/scrape.yml:ro
      - victoriametrics:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      retries: 20

  grafana:
    image: grafana/grafana:13.0.10
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run deploy/lab/init-env.sh}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:13000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../agent/grafana:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      retries: 30
    depends_on:
      victoriametrics: { condition: service_healthy }

volumes:
  state:
  bundles:
  run-node-1:
  run-node-2:
  shm-node-1: { driver_opts: { type: tmpfs, device: tmpfs, o: "uid=1001,gid=1001,mode=0750" } }
  shm-node-2: { driver_opts: { type: tmpfs, device: tmpfs, o: "uid=1001,gid=1001,mode=0750" } }
  spool-node-1:
  spool-node-2:
  clickhouse:
  postgres:
  minio:
  victoriametrics:
  grafana:
