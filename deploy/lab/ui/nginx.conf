# Serves the built UI and forwards the API to the control plane, so the
# browser talks to one origin.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://control-plane:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
