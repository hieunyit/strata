# Serves the built UI and forwards the API to the control plane, so the
# browser talks to one origin.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://control-plane:8080;
        # the client address for login throttling and the audit log; set,
        # not appended, so a client cannot put its own address first
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
