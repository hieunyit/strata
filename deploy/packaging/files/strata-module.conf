# Strata, http-level settings (install.sh writes this to
# /etc/nginx/conf.d/strata.conf, with the node id filled in). The module is
# loaded at the top of nginx.conf:
#     load_module modules/ngx_http_strata_module.so;
# Then turn inspection on per server or location (both lines):
#     strata on;
#     strata_policy example-api;
strata_control_file  /var/lib/strata/bundles/control;
strata_bundle_dir    /var/lib/strata/bundles;
strata_bundle_pubkey /etc/strata/bundle.pub;
strata_node_id       @NODE_ID@;
strata_event_socket  unix:/run/strata/events.sock;
strata_metrics_file  /run/strata/metrics;
